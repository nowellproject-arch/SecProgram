<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Current Month Entry (phone)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/js/indexeddb.js"></script>
<style>
  .chip {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    height: 26px;
    padding: 0 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.01em;
    white-space: nowrap;
    flex: none;
    transition: transform 0.1s ease, filter 0.15s ease;
  }
  .chip:active { transform: scale(0.96); }
  .chip select {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    font-size: 16px;
    cursor: pointer;
  }
  .chip .lab { pointer-events: none; }

  .c-start   { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
  .c-pioneer { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
  .c-end     { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
  .c-none    { background: #f8fafc; border: 1px dashed #cbd5e1; color: #94a3b8; }

  .num {
    width: 100%;
    height: 34px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: #584980;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    transition: all 0.15s ease;
  }
  .num:hover { background: #f3f0f9; }
  .num:focus {
    background: #fefce8;
    border-color: #eab308;
    box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.15);
    outline: none;
  }

  .note {
    flex: 1;
    min-width: 0;
    height: 34px;
    font-size: 13.5px;
    color: #334155;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 0 8px;
    transition: all 0.15s ease;
  }
  .note:hover { background: #f8fafc; }
  .note:focus {
    background: #fefce8;
    border-color: #eab308;
    box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.15);
    outline: none;
  }

  .m-l { display: none; }

  @media (min-width: 768px) {
    body.pb-24 { padding-bottom: 24px; }
    #layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr) 260px;
      gap: 18px;
      align-items: start;
      max-width: 1640px;
      margin: 0 auto;
      padding: 18px;
    }
    #layout main { display: contents; }
    #layout .mid { grid-column: 2; grid-row: 1; min-width: 0; }
    #layout .side { grid-column: 3; grid-row: 1; min-width: 0; margin-top: 0; }
    #layout .mid > .phone-only + div { margin-top: 0; }
    #layout .phone-only,
    #layout #closeList,
    #bd { display: none !important; }

    #layout #sheet {
      display: flex;
      position: sticky;
      inset: auto;
      top: 18px;
      grid-column: 1;
      grid-row: 1;
      height: calc(100vh - 36px);
      border: 1px solid #cbd5e1;
      border-radius: 18px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      z-index: auto;
    }
    #layout .rowgrid {
      grid-template-columns: 15% 10% 10% 9% 11% 45%;
    }
  }

  @media (min-width: 1024px) {
    #layout {
      grid-template-columns: 270px minmax(0, 1fr) 310px;
      gap: 22px;
      padding: 20px;
    }
    #layout #sheet {
      top: 20px;
      height: calc(100vh - 40px);
    }
  }

  @media (min-width: 1200px) {
    #layout .m-s { display: none; }
    #layout .m-l { display: inline; }
  }

  .listtab{display:none}
  @media (max-width:767px){
    #layout .mid{position:relative;padding-left:44px}
    #layout .listtab{display:flex;flex-direction:column;align-items:center;gap:6px;position:absolute;left:8px;top:12px;bottom:12px;width:24px;margin:0;padding:6px 0;border:0;border-radius:12px;background:#6b5b95;color:#fff;overflow:hidden;cursor:pointer}
    .listtab .ico{font-size:15px;line-height:1}
    .listtab .lab{flex:1;min-height:0;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;font-weight:700;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #sheet,#sheet.hidden{display:flex;position:fixed;inset:0 auto 0 0;width:86%;max-width:340px;height:100%;border-radius:0 18px 18px 0;transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
    #sheet.open{transform:none;visibility:visible;transition:transform .22s ease,visibility 0s}
  }

</style>
</head>

<body class="bg-slate-200/70 text-slate-800 antialiased pb-24 selection:bg-[#6b5b95]/20">

<div id="layout">
  <main class="p-3 space-y-5">

    <!-- =========================================================
         PART 2 (CENTER / MAIN FOCUS): S-21 PUBLISHER RECORD
         ========================================================= -->
    <section class="mid bg-[#f6f4fa] rounded-3xl border-2 border-[#6b5b95]/35 shadow-md p-3 md:p-4 space-y-3">

      <!-- Clear S-21 Form Banner -->
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-2">
          <span class="bg-[#6b5b95] text-white text-[11px] font-extrabold tracking-wider px-2.5 py-0.5 rounded-md shadow-2xs">S-21</span>
          <h2 class="text-xs md:text-sm font-extrabold uppercase tracking-wide text-[#4c3e70]">Congregation’s Publisher Record</h2>
        </div>
        <span class="text-[11px] font-semibold text-[#6b5b95]/80">Individual Card</span>
      </div>

            <!-- Phone category strip: opens the publisher list -->
      <button id="openList" class="phone-only listtab" aria-label="Open publisher list">
        <span class="ico">☰</span><span id="catLabel" class="lab"></span>
      </button>

      <!-- Publisher Details Card -->
      <div class="bg-white rounded-2xl border border-[#6b5b95]/20 shadow-xs p-3.5 space-y-3">
        <div class="flex items-center gap-2.5">
          <label for="pName" class="text-[11px] font-extrabold uppercase tracking-wider text-[#6b5b95] shrink-0">Name</label>
          <input id="pName" readonly class="flex-1 min-w-0 h-9 px-3 rounded-xl border border-slate-200 bg-slate-50 text-sm font-extrabold text-slate-900 focus:outline-none">
          <button id="pp" type="button" aria-label="Previous publisher" class="phone-only w-8 h-9 rounded-xl bg-[#6b5b95]/10 text-[#6b5b95] font-extrabold active:scale-95 transition">&lt;</button>
          <button id="np" type="button" aria-label="Next publisher" class="phone-only w-8 h-9 rounded-xl bg-[#6b5b95]/10 text-[#6b5b95] font-extrabold active:scale-95 transition">&gt;</button>
        </div>
        <div class="flex flex-wrap items-center gap-4 text-sm pt-0.5">
          <label class="flex items-center gap-2 text-xs font-bold text-slate-600">
            Group
            <input id="pGroup" type="text" inputmode="numeric" class="w-14 h-8 text-center font-extrabold text-slate-900 rounded-lg border border-slate-300 focus:border-[#6b5b95] focus:ring-2 focus:ring-[#6b5b95]/20 focus:outline-none transition">
          </label>
          <label class="flex items-center gap-2 text-xs font-bold text-slate-600 cursor-pointer select-none">
            <input id="pRP" type="checkbox" class="w-4 h-4 rounded accent-[#6b5b95] cursor-pointer">
            Regular Pioneer (RP)
          </label>
          <span id="pStatus" class="ml-auto text-[11px] font-extrabold px-2.5 py-1 rounded-lg"></span>
        </div>
      </div>

      <!-- S-21 Monthly Table (with Service Year Bar attached directly on top) -->
      <div class="bg-white rounded-2xl border border-[#6b5b95]/25 shadow-xs overflow-hidden">
        
        <!-- Service Year Bar (Same width as S-21 Table) -->
        <div class="bg-gradient-to-r from-[#584980] to-[#6b5b95] text-white flex items-center justify-between px-3 py-2 border-b border-white/15">
          <button id="py" aria-label="Previous service year" class="w-8 h-8 rounded-lg bg-white/15 hover:bg-white/25 active:scale-95 transition flex items-center justify-center text-sm font-bold">&lt;</button>
          <div class="flex items-center gap-2">
            <span class="hidden sm:inline text-[10px] uppercase tracking-widest text-white/75 font-semibold">Service Year</span>
            <span id="syNum" class="text-base md:text-lg font-extrabold tracking-tight"></span>
            <span id="syPill" class="text-[10px] font-bold bg-white/20 px-2 py-0.5 rounded-full"></span>
          </div>
          <button id="ny" aria-label="Next service year" class="w-8 h-8 rounded-lg bg-white/15 hover:bg-white/25 active:scale-95 transition flex items-center justify-center text-sm font-bold">&gt;</button>
        </div>

        <!-- Column Headers -->
        <div class="rowgrid grid grid-cols-[16%_11%_13%_10%_13%_37%] bg-[#6b5b95]/90 text-white text-[11px] font-bold tracking-wide py-2 px-2 text-center items-center">
          <div id="thYear" class="text-left pl-1 text-[13px] font-extrabold"></div>
          <div>Shared</div>
          <div>BS</div>
          <div>AUX</div>
          <div>HRS</div>
          <div class="text-left pl-2">Comments</div>
        </div>

        <div id="rows" class="divide-y divide-slate-200/80"></div>

        <div class="bg-[#6b5b95]/[0.06] border-t-2 border-[#6b5b95]/20 px-4 py-3 flex items-center justify-between">
          <span class="text-[11px] font-bold uppercase tracking-wider text-[#6b5b95]">Service Year Total</span>
          <div class="flex items-center gap-2 text-xs font-bold text-slate-600">
            <span>Total hours:</span>
            <span id="tot" class="text-base font-extrabold text-[#584980] bg-white px-2.5 py-0.5 rounded-lg border border-[#6b5b95]/20 shadow-2xs">0</span>
          </div>
        </div>
      </div>

    </section><!-- /mid (S-21) -->


    <!-- =========================================================
         PART 3 (RIGHT): CONGREGATION SUMMARY & ATTENDANCE
         ========================================================= -->
    <aside class="side bg-slate-100/90 rounded-3xl border border-slate-300/80 p-3 md:p-3.5 space-y-3.5">

      <!-- Section Label -->
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-600">Congregation Report</h2>
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Monthly</span>
      </div>

      <!-- Month Summary Card -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-3.5 space-y-3">
        <div class="flex items-center justify-between gap-2 pb-2.5 border-b border-slate-100">
          <b id="mName" class="text-[15px] font-extrabold text-slate-800"></b>
          <button id="mStatus" onclick="closeReport()" class="px-3 py-1 rounded-full border text-xs font-bold transition hover:opacity-85 active:scale-95"></button>
        </div>

        <!-- Inset Active Publishers Box -->
        <div class="bg-slate-50 rounded-xl border border-slate-200/80 p-3">
          <div class="flex items-center justify-between gap-2 mb-1">
            <h4 class="text-[11px] font-bold uppercase tracking-wider text-slate-600">All active publishers</h4>
            <input id="sAct" readonly value="0" class="w-16 h-8 bg-white border border-slate-200 rounded-lg text-center font-extrabold text-sm text-[#6b5b95] shadow-2xs">
          </div>
          <p class="text-[11px] leading-snug text-slate-400">
            Count all persons in congregation reporting in last 6 months.
          </p>
        </div>

        <div id="sum" class="space-y-2 text-xs"></div>
      </div>

      <!-- Average Weekend Attendance Card -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-3.5">
        <button id="attHead" class="w-full flex items-center justify-between text-left group">
          <b class="text-sm font-bold text-slate-800 group-hover:text-[#6b5b95] transition">Average weekend attendance</b>
          <span id="attIcon" class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-[10px] text-slate-500">▼</span>
        </button>
        <div id="attAvg" class="mt-2.5 py-2 rounded-xl bg-slate-50 border border-slate-200/70 text-center text-2xl font-extrabold text-[#6b5b95]">0.0</div>
        
        <div id="attBody" class="hidden mt-3.5 pt-3 border-t border-slate-100 space-y-3">
          <div>
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Midweek</div>
            <div class="flex gap-2">
              <input id="noMtgs1" inputmode="numeric" placeholder="No. of Mtgs" class="w-1/2 h-9 text-center rounded-xl border border-slate-300 text-sm font-medium focus:border-[#6b5b95] focus:ring-2 focus:ring-[#6b5b95]/20 focus:outline-none">
              <input id="attM" inputmode="numeric" placeholder="Total Att." class="w-1/2 h-9 text-center rounded-xl border border-slate-300 text-sm font-medium focus:border-[#6b5b95] focus:ring-2 focus:ring-[#6b5b95]/20 focus:outline-none">
            </div>
          </div>
          <div>
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Weekend</div>
            <div class="flex gap-2">
              <input id="noMtgs2" inputmode="numeric" placeholder="No. of Mtgs" class="w-1/2 h-9 text-center rounded-xl border border-slate-300 text-sm font-medium focus:border-[#6b5b95] focus:ring-2 focus:ring-[#6b5b95]/20 focus:outline-none">
              <input id="attW" inputmode="numeric" placeholder="Total Att." class="w-1/2 h-9 text-center rounded-xl border border-slate-300 text-sm font-medium focus:border-[#6b5b95] focus:ring-2 focus:ring-[#6b5b95]/20 focus:outline-none">
            </div>
          </div>
        </div>
      </div>

    </aside><!-- /side -->
  </main>


  <!-- =========================================================
       PART 1 (LEFT / PHONE SHEET): PUBLISHERS DIRECTORY
       ========================================================= -->
  <div id="bd" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-[1px] z-40"></div>
  <aside id="sheet" class="hidden fixed inset-x-0 bottom-0 h-[85%] bg-white rounded-t-3xl shadow-2xl z-50 flex flex-col overflow-hidden">


    <div class="p-3.5 bg-slate-50/90 border-b border-slate-200/80 space-y-2.5">
      <div class="flex items-center justify-between">
        <div>
          <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Directory</span>
          <b class="text-base font-extrabold text-slate-800">Publishers list</b>
        </div>
        <button id="closeList" aria-label="Close list" class="w-8 h-8 rounded-full bg-slate-200/80 hover:bg-slate-300 text-slate-700 font-bold flex items-center justify-center transition">✕</button>
      </div>
      <select id="cat" class="w-full h-9 rounded-xl border border-slate-300 bg-white px-3 text-xs font-bold text-slate-700 focus:border-[#6b5b95] focus:ring-2 focus:ring-[#6b5b95]/20 focus:outline-none">
        <option value="ACTIVE">ACTIVE PUBLISHERS</option>
        <option value="GROUP">BY GROUP</option>
        <option value="ALL">ALL</option>
        <option value="PUBREP">ALL PUBLISHERS REPORTED</option>
        <option value="AUXREP">ALL AUX REPORTED</option>
        <option value="RPREP">ALL RP REPORTED</option>
        <option value="MAUX">CURRENT MONTH AUX</option>
        <option value="RP">REGULAR PIONEERS</option>
        <option value="INACTIVE">INACTIVES</option>
      </select>
      <input id="q" placeholder="Search publisher..." class="w-full h-9 px-3 rounded-xl border border-slate-300 bg-white text-sm placeholder:text-slate-400 focus:border-[#6b5b95] focus:ring-2 focus:ring-[#6b5b95]/20 focus:outline-none">
    </div>

    <div id="list" class="flex-1 overflow-y-auto divide-y divide-slate-100"></div>

    <div class="px-4 py-2.5 bg-slate-50 border-t border-slate-200/80 flex items-center justify-between text-xs font-bold text-slate-500">
      <span>Count</span>
      <span id="cnt" class="text-slate-800 bg-white px-2.5 py-0.5 rounded-md border border-slate-200">0</span>
    </div>
  </aside>
</div><!-- /layout -->
<script>
const $ = id => document.getElementById(id);
const MON = ['Sept','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'];
const MFULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const FLAG = {'NEW UBP':['UBP','start'],'MOVED IN':['IN','start'],'REACTIVATED':['REACT','start'],'REINSTATED':['REINST','start'],
  'RP':['RP','pioneer'],'SP':['SP','pioneer'],'INACTIVE':['INACT','end'],'MOVED OUT':['OUT','end'],'DISQUALIFIED':['DQ','end'],'REMOVED':['REM','end']};
const OPTS = '<option value=""></option>' + Object.keys(FLAG).map(k => `<option value="${k}">${k}</option>`).join('');
const T = v => ['1','TRUE','YES','Y','?','-1'].includes(String(v ?? '').trim().toUpperCase());
const num = (y, i) => 26 + (y - 2012) * 12 + i;                    // same month NUMBER formula as the desktop page
const isActivePub = p => !String(p.Status || '').trim() || String(p.Status).trim().toLowerCase() === 'active';

let pubs = [], recs = [], pub = null, st = [], sy = 0, active = 0, activeSY = 0, closed = false, mrec = null, queue = Promise.resolve();
// same reporting-month rule as the desktop page (the month changes on the 21st); getMonthIndex() relies on these globals
(function () { const t = new Date(); window.activeCalendarMonth = t.getMonth(); window.activeCalendarYear = t.getFullYear();
  if (t.getDate() < 21) { if (--window.activeCalendarMonth < 0) { window.activeCalendarMonth = 11; window.activeCalendarYear--; } } })();
const setActive = n => { active = n; activeSY = sy = 2026 + Math.floor((n - 194) / 12); };
const calInfo = n => { const d = n - 194, sh = Math.floor(d / 12); let o = d % 12; if (o < 0) o += 12; return o >= 4 ? { m: o - 4, y: 2026 + sh, sy: 2026 + sh } : { m: o + 8, y: 2025 + sh, sy: 2026 + sh }; };
async function loadMonthly() {
  const db = await openDB();
  const mr = db.objectStoreNames.contains('MonthlyRecords') ? await getAll(db, 'MonthlyRecords') : [];
  db.close();
  mrec = mr.find(r => Number(r.NUMBER) === active) || null;
  closed = !!mrec && Number(mrec.Closed) === 1;
}

const openDB = () => new Promise((res, rej) => { const r = indexedDB.open('CongregationDB'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const getAll = (db, s) => new Promise((res, rej) => { const r = db.transaction(s).objectStore(s).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); });

async function init() {
  setActive(Number(typeof getMonthIndex === 'function' ? getMonthIndex() : 0));
  const db = await openDB();
  pubs = await getAll(db, 'PUBLISHERS'); recs = await getAll(db, 'RECORDS');
  db.close();
  await loadMonthly();
  if (closed && new Date().getDate() < 21) { setActive(active + 1); await loadMonthly(); }   // closed early: move on to the next month
  let id = null;
  try { if (typeof globalSelectedPubID === 'function') id = await globalSelectedPubID(); } catch (e) {}
  pub = pubs.find(p => String(p.IDPub) === String(id)) || sorted().find(isActivePub) || pubs[0] || null;
  paintAll();
}
const nameOf = p => `${p.LName || ''}, ${p.FNAME || ''}`.replace(/^,\s*/, '').trim();
const sorted = () => [...pubs].sort((a, b) => (a.LName || '').localeCompare(b.LName || '') || (a.FNAME || '').localeCompare(b.FNAME || ''));

function build() {
  const m = new Map();
  recs.forEach(r => { if (pub && String(r.IdPubs) === String(pub.IDPub)) m.set(Number(r.NUMBER), r); });
  const pos = x => { const v = Number(x); return v > 0 ? String(v) : ''; };
  st = MON.map((_, i) => {
    const n = num(sy, i), r = m.get(n);
    return { n, lock: n > active || !pub, min: !!r && T(r.MINISTRY), bs: r ? pos(r.BS) : '', aux: !!r && T(r.AUX),
      hr: r ? pos(r.HRS) : '', note: r ? String(r.Note || '').trim() : '', rem: r ? String(r.REMARKS || '').trim() : '', touched: false };
  });
}

function paintAll() {
  $('syNum').textContent = sy;
  $('syPill').textContent = sy === activeSY ? 'Current Service Year' : 'Service Year';
  $('py').style.visibility = sy === activeSY ? 'visible' : 'hidden';
  $('ny').style.visibility = sy === activeSY ? 'hidden' : 'visible';
  $('thYear').textContent = sy;
  if (pub) {
       $('pName').value = nameOf(pub);
    $('pGroup').value = pub.GROUP || ''; $('pRP').checked = T(pub.RP);
    const s = String(pub.Status || '').trim() || 'Active';
    $('pStatus').textContent = 'Status: ' + s;
    $('pStatus').className = 'ml-auto text-[11px] font-bold px-2 py-1 rounded-lg ' + (s === 'Active' ? 'bg-rose-50 text-rose-600' : 'bg-slate-100 text-slate-600');
  }
    build(); rows(); summary(); paintAtt(); navArrows(); refreshList();
}

const MLONG = ['September','October','November','December','January','February','March','April','May','June','July','August'];

function rows() {
  const rp = pub && T(pub.RP), noPub = !pub;
  $('rows').innerHTML = st.map((s, i) => {
    const f = FLAG[s.rem.toUpperCase()];
    const chip = f ? `c-${f[1]}` : 'c-none';
    const lab = f ? f[0] : (s.rem || '＋');
    const d = s.lock ? 'disabled' : '';
    const dim = s.lock ? 'opacity-40' : '';
    return `<div class="rowgrid grid grid-cols-[16%_11%_13%_10%_13%_37%] items-center h-8 px-1 ${i % 2 ? 'bg-slate-50' : 'bg-white'}">
      <b class="text-xs pl-1 ${dim}"><span class="m-s">${MLONG[i]}</span><span class="m-l">${MLONG[i]}</span></b>
      <label class="flex justify-center ${dim}"><input type="checkbox" data-i="${i}" data-f="min" ${s.min ? 'checked' : ''} ${d} class="w-5 h-5 accent-[#6b5b95]"></label>
      <input class="num ${dim}" inputmode="numeric" maxlength="3" data-i="${i}" data-f="bs" value="${s.bs}" ${d}>
      <label class="flex justify-center"><input type="checkbox" data-i="${i}" data-f="aux" ${s.aux ? 'checked' : ''} ${rp || noPub ? 'disabled' : ''} class="w-5 h-5 accent-[#6b5b95]"></label>
      <input class="num ${dim}" inputmode="decimal" maxlength="5" data-i="${i}" data-f="hr" value="${s.hr}" ${d}>
      <div class="flex items-center gap-1 pl-1 ${dim}">
        <input class="note" data-i="${i}" data-f="note" value="${s.note.replace(/"/g, '&quot;')}" ${d}>
        <span class="chip ${chip}"><span class="lab">${lab}</span><select data-i="${i}" data-f="rem" ${d}>${OPTS.replace(`value="${s.rem}"`, `value="${s.rem}" selected`)}</select></span>
      </div></div>`;
  }).join('');
  $('tot').textContent = Math.round(st.reduce((a, s) => a + (parseFloat(s.hr) || 0), 0) * 100) / 100;
}

$('rows').addEventListener('change', e => {
  const el = e.target, f = el.dataset.f; if (f === undefined) return;
  const s = st[+el.dataset.i];
  if (el.type === 'checkbox') s[f] = el.checked;
  else if (f === 'rem') { s.rem = el.value; s.touched = true; }
  else if (f === 'note') s.note = el.value.trim();
  else s[f] = el.value.replace(f === 'hr' ? /[^0-9.]/g : /[^0-9]/g, '').replace(/\.$/, '');
  save(+el.dataset.i);
});

// same record shape and rules as the desktop save (hours/studies imply shared, RP/SP auto flag, delete when empty)
function save(i) {
  const s = st[i], id = String(pub.IDPub), n = s.n;
  if ((+s.hr > 0) || (+s.bs > 0)) s.min = true;
  const rp = T(pub.RP), nw = T(pub.New) || T(pub.NEW) || T(pub.SF);
  let rem = s.rem; if (!s.touched && !rem) rem = rp ? 'RP' : (nw ? 'SP' : '');
  s.rem = rem;
  const has = s.min || s.bs !== '' || s.aux || s.hr !== '' || s.note !== '' || rem !== '' || s.touched;
  const rec = { IdPubs: id, NUMBER: n, MINISTRY: s.min ? 1 : 0, BS: s.bs === '' ? '' : Number(s.bs), AUX: s.aux ? 1 : 0,
    HRS: s.hr === '' ? '' : Number(s.hr), Note: s.note, REMARKS: rem, Date_entered: nw ? null : (s.min ? active : null), updated_at: Date.now(), is_deleted: 0 };
  recs = recs.filter(r => !(Number(r.NUMBER) === n && String(r.IdPubs) === id));
  if (has) recs.push(rec);
  rows(); summary(); refreshList();
  queue = queue.then(async () => {
    const db = await openDB(), tx = db.transaction('RECORDS', 'readwrite'), os = tx.objectStore('RECORDS');
    has ? os.put(rec) : os.delete([n, id]);
    await new Promise(r => tx.oncomplete = r); db.close();
    if (typeof setSyncUnsaved === 'function') setSyncUnsaved();
    const cur = recs.filter(r => Number(r.Date_entered) === active);   // keeps the localStorage copy the desktop page writes
    localStorage.setItem('CurrentMonthReportedPublishers', JSON.stringify({ CurrentMonthID: active, UpdatedAt: new Date().toISOString(), TotalRecords: cur.length, Records: cur }));
  }).catch(err => console.error('save failed', err));
}

function patchPub(ch) {                                              // only Group / RP, applied to the fresh DB record
  Object.assign(pub, ch);
  queue = queue.then(async () => {
    const db = await openDB(), tx = db.transaction('PUBLISHERS', 'readwrite'), os = tx.objectStore('PUBLISHERS');
    const g = os.get(pub.IDPub); g.onsuccess = () => { if (g.result) os.put(Object.assign(g.result, ch)); };
    await new Promise(r => tx.oncomplete = r); db.close();
    if (typeof setSyncUnsaved === 'function') setSyncUnsaved();
  });
}
$('pGroup').onchange = e => pub && patchPub({ GROUP: e.target.value.trim() });
$('pRP').onchange = e => { if (!pub) return; patchPub({ RP: e.target.checked ? '1' : '0' }); rows(); };


function summary() {
  const info = (() => {
    const d = active - 194, sh = Math.floor(d / 12);
    let o = d % 12;
    if (o < 0) o += 12;
    return o >= 4
      ? { m: o - 4, y: 2026 + sh }
      : { m: o + 8, y: 2025 + sh };
  })();

  $('mName').textContent = `${MFULL[info.m]} ${info.y}`;

  $('mStatus').textContent = closed ? 'CLOSED' : 'Active';
  $('mStatus').disabled = closed;

  $('mStatus').className =
    'px-3 py-1 rounded-full border text-sm font-bold ' +
    (closed
      ? 'bg-rose-50 text-rose-700 border-rose-300'
      : 'bg-emerald-50 text-emerald-700 border-emerald-400');

  // All active publishers
  $('sAct').value = pubs.filter(isActivePub).length;

  // Calculate ministry summaries
  const g = {
    pub: [0, 0, 0],
    aux: [0, 0, 0],
    rp: [0, 0, 0]
  };

  recs.forEach(r => {
    if (Number(r.Date_entered) !== active) return;

    const h = Number(r.HRS) || 0;
    const b = Number(r.BS) || 0;

    if (!(T(r.MINISTRY) || h > 0 || b > 0)) return;

    const k = String(r.REMARKS || '').toUpperCase().includes('RP')
      ? 'rp'
      : (T(r.AUX) ? 'aux' : 'pub');

    g[k][0]++;
    g[k][1] += h;
    g[k][2] += b;
  });

  // Generate individual summary cards
  const card = (title, k, showHours = true) => {
    const [reports, hours, studies] = g[k];

    const field = (label, value) => `
      <label class="text-[11px] font-semibold text-slate-500">
        ${label}
        <input readonly value="${value}"
          class="mt-0.5 w-full h-9 bg-slate-50 border border-slate-200 rounded-xl text-center font-bold text-[15px] text-slate-800">
      </label>`;

    return `
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-3.5">
        <h4 class="text-xs font-bold uppercase tracking-wider mb-2">${title}</h4>
        <div class="grid ${showHours ? 'grid-cols-3' : 'grid-cols-2'} gap-2">
          ${field('Reports', reports)}
          ${showHours ? field('Hours', Math.round(hours * 100) / 100) : ''}
          ${field('Studies', studies)}
        </div>
      </div>`;
  };

  $('sum').innerHTML = `
    ${card('Publishers', 'pub', false)}
    ${card('Auxiliary pioneers', 'aux')}
    ${card('Regular pioneers', 'rp')}
  `;
}


// year, previous/next publisher, list sheet
$('py').onclick = () => { if (sy > 2000) { sy = activeSY - 1; paintAll(); } };
$('ny').onclick = () => { sy = activeSY; paintAll(); };
function pick(p) { pub = p; if (typeof globalSelectedPubID === 'function') { try { globalSelectedPubID(p.IDPub); } catch (e) {} } paintAll(); }

function cycle(d) {
  const l = catList('');                                   // names of the selected category
  const i = l.findIndex(p => String(p.IDPub) === String(pub && pub.IDPub));
  const n = i < 0 ? (d > 0 ? 0 : l.length - 1) : i + d;
  if (n >= 0 && n < l.length) pick(l[n]);                  // stops at the first and last name
}

function navArrows() {
  const l = catList(''), i = l.findIndex(p => String(p.IDPub) === String(pub && pub.IDPub));
  $('pp').style.visibility = (l.length && i !== 0) ? 'visible' : 'hidden';
  $('np').style.visibility = (l.length && i !== l.length - 1) ? 'visible' : 'hidden';
}

$('pp').onclick = () => cycle(-1); $('np').onclick = () => cycle(1);

function catList(q) {
  const c = $('cat').value;
  const S = repSets();
  const out = p => /^(inactive|moved out|disqualified|removed)$/i.test(String(p.Status || '').trim());
  const inCat = p => { const id = String(p.IDPub); switch (c) {
    case 'ALL': return true;
    case 'INACTIVE': return String(p.Status || '').trim().toLowerCase() === 'inactive';
    case 'GROUP': return !out(p) && String(p.GROUP || '').trim() !== '';
    case 'PUBREP': return !out(p) && S.pub.has(id);
    case 'AUXREP': return !out(p) && S.aux.has(id);
    case 'RPREP': return !out(p) && S.rp.has(id);
    case 'MAUX': return !out(p) && S.maux.has(id);
    case 'RP': return !out(p) && T(p.RP);
    default: return isActivePub(p); } };
  const l = sorted().filter(p => nameOf(p).toLowerCase().includes(q) && inCat(p));
  if (c === 'GROUP') l.sort((a, b) => String(a.GROUP).localeCompare(String(b.GROUP), undefined, { numeric: true }) || nameOf(a).localeCompare(nameOf(b)));
  return l;
}

function paintList() {
  const q = $('q').value.toLowerCase(), c = $('cat').value, l = catList(q), top = $('list').scrollTop;
  $('cnt').textContent = l.length;
  $('list').innerHTML = l.map(p => `<button data-id="${p.IDPub}" class="w-full px-4 py-3 text-left text-sm ${pub && String(p.IDPub) === String(pub.IDPub) ? 'bg-[#6b5b95] text-white font-bold' : ''}">${c === 'GROUP' ? 'G' + p.GROUP + ' · ' : ''}${nameOf(p)}</button>`).join('');
  $('list').scrollTop = top;
}
const DESK = matchMedia('(min-width:768px)');   // same breakpoint as the CSS
const refreshList = () => { if (DESK.matches) paintList(); };
DESK.addEventListener('change', refreshList);

const sheet = open => { ['bd', 'sheet'].forEach(id => $(id).classList.toggle('hidden', !open)); $('sheet').classList.toggle('open', open); if (open) paintList(); };

$('openList').onclick = () => sheet(true); $('closeList').onclick = $('bd').onclick = () => sheet(false);
const CATNAME = { ACTIVE: 'Active Publishers', GROUP: 'By Group', ALL: 'All', PUBREP: 'All Publishers Reported', AUXREP: 'All Aux Reported',
  RPREP: 'All RP Reported', MAUX: 'Current Month Aux', RP: 'Regular Pioneers', INACTIVE: 'Inactives' };

 function catLabel() { $('catLabel').textContent = CATNAME[$('cat').value] || ''; }

  $('q').oninput = paintList;
$('cat').onchange = () => { catLabel(); paintList(); navArrows(); };
catLabel();
$('list').onclick = e => { const b = e.target.closest('button'); if (!b) return; pick(pubs.find(p => String(p.IDPub) === b.dataset.id)); sheet(false); };

// tell the main page to hide/show its bars on scroll (same messages as the desktop sub page)
(function () {
  let last = 0;
  addEventListener('scroll', () => {
    const y = scrollY, d = y - last; if (Math.abs(d) < 8) return;
    parent.postMessage({ type: d > 0 && y > 10 ? 'hideTabBar' : 'showTabBar' }, '*'); last = y;
  }, { passive: true });
})();

function repSets() {
  const s = { pub: new Set(), aux: new Set(), rp: new Set(), maux: new Set() };
  recs.forEach(r => {
    const id = String(r.IdPubs);
    if (Number(r.NUMBER) === active && T(r.AUX)) s.maux.add(id);
    if (Number(r.Date_entered) !== active) return;
    const h = Number(r.HRS) || 0, b = Number(r.BS) || 0;
    if (!(T(r.MINISTRY) || h > 0 || b > 0)) return;
    (String(r.REMARKS || '').toUpperCase().includes('RP') ? s.rp : T(r.AUX) ? s.aux : s.pub).add(id);
  });
  return s;
}

// attendance card (MonthlyRecords, same fields as the desktop page)
const ATT = ['noMtgs1', 'attM', 'noMtgs2', 'attW'];
function avg() { const m = parseFloat($('noMtgs2').value), t = parseFloat($('attW').value); $('attAvg').textContent = m > 0 && !isNaN(t) ? (t / m).toFixed(1) : '0.0'; }
function paintAtt() {
  const set = (id, v) => $(id).value = v ? v : '';
  set('noMtgs1', mrec && mrec.NoMtgs1); set('attM', mrec && mrec.AttendcMidweekTotal);
  set('noMtgs2', mrec && mrec.NoMtgs2); set('attW', mrec && mrec.AttendcPublickTotal);
  ATT.forEach(id => $(id).disabled = closed); avg();
}
$('attHead').onclick = () => { const o = $('attBody').classList.toggle('hidden'); $('attIcon').textContent = o ? '▼' : '▲'; };
let attTimer = null;
ATT.forEach(id => $(id).addEventListener('input', () => { $(id).value = $(id).value.replace(/[^0-9]/g, ''); avg(); clearTimeout(attTimer); attTimer = setTimeout(() => saveMonthly({}), 400); }));

function saveMonthly(extra) {
  const v = id => { const x = $(id).value.trim(); return x === '' ? '' : Number(x); };
  const n = active, ci = calInfo(n);
  const vals = Object.assign({ NoMtgs1: v('noMtgs1'), AttendcMidweekTotal: v('attM'), NoMtgs2: v('noMtgs2'), AttendcPublickTotal: v('attW'),
    ActivePublishers: pubs.filter(isActivePub).length }, extra);
  queue = queue.then(() => new Promise(async res => {
    const db = await openDB(), tx = db.transaction('MonthlyRecords', 'readwrite'), os = tx.objectStore('MonthlyRecords');
    os.getAll().onsuccess = e => {
      const row = (e.target.result || []).find(r => Number(r.NUMBER) === n);
      if (row) { Object.assign(row, vals); os.put(row); mrec = row; }
      else { mrec = Object.assign({ NUMBER: n, MONTH_: MFULL[ci.m], Year: ci.y, ServiceYear: ci.sy, Closed: 0 }, vals); os.add(mrec); }
    };
    tx.oncomplete = () => { db.close(); if (typeof setSyncUnsaved === 'function') setSyncUnsaved(); res(); };
    tx.onerror = () => { db.close(); res(); };
  }));
  return queue;
}

async function closeReport() {
  if (closed) return;
  const msg = 'Are you sure you want to close this monthly report?';
  const ok = (window.parent && window.parent.showCustomConfirm) ? await window.parent.showCustomConfirm(msg, { okText: 'Yes, Close', cancelText: 'Cancel' }) : confirm(msg);
  if (!ok) return;
  await saveMonthly({ Closed: 1 });
  setActive(active + 1);                       // move to the next reporting month, as the desktop page does
  await loadMonthly(); paintAll();
}

init();
</script>
