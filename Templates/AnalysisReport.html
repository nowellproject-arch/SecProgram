<!DOCTYPE html>
<html lang="en">
<head>

  <style>

      --primary: #d96b00;
      --bg-body: #f8fafc;

      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-blue: #2563eb;

    * {
   
      margin: 0;

    }

    html, body {
      height: 100%;

      color: var(--text-main);

   .dashboard-grid {
        display: grid;
        grid-template-columns: 1.1fr 1fr;

        height: calc(100vh - 100px); /* Changed from -16px to -100px */

        }
   .card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        height: 100%;          /* Lock card height to the grid cell */

        overflow: hidden;      /* Keep AI box fixed inside the card boundary */
        }

        .card-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-main);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 4px;
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
        }

/* COMPACT STATS */

      grid-template-columns: 1fr 1fr;

/* Base style for Left Column Buttons */
.dash-link {

  color: var(--accent-blue);
  text-align: left;
  padding: 2px 5px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;

/* Base style for Right Column Buttons */

  font-size: 12px;
  cursor: pointer;

  justify-content: flex-end;

/* Right Column Yearly Buttons */
.comparison-grid .badge-sy-link {
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
  justify-self: end;    /* Forces it to stay pinned to the right side of Column 2 */
  display: flex;
  align-items: center;
}

/* Hover States (Fixed) */
.dash-link:hover,
.badge-sy-link:hover {

}

/* Active States (Fixed) */
.dash-link.active,

  color: #1e40af;

}


/* Left Column Buttons */

  justify-content: space-between;

}


/* Ensure the label text aligns cleanly on the left */
.comparison-grid .dash-link span:first-child {

    /* RIGHT RESULT TABLE */

/* ============================================================
   ANALYSIS table
   ============================================================ */
function setAnalysisTable(columns,rows){
    const header=document.getElementById("analysis-table-header");
    const tbody=document.getElementById("publishers-table-body");

    if(!header||!tbody)return;

    header.innerHTML=columns.map(col=>
        `<th>${col.label}</th>`
    ).join("");

    tbody.innerHTML=rows.map(row=>
        `<tr>${columns.map(col=>
            `<td>${typeof col.render==="function"
                ? col.render(row)
                : row[col.key]??""}</td>`
        ).join("")}</tr>`
    ).join("");
}




/* ============================================================
   1. CURRENT DISPLAY DATA
   ------------------------------------------------------------
   ADD FUTURE TEMPORARY/DISPLAY DATA HERE IF NEEDED
   ============================================================ */
let currentData=[];


/* ============================================================
   2. COMMON HELPERS
   ------------------------------------------------------------
   ADD FUTURE COMMON HELPER FUNCTIONS HERE
   ============================================================ */
function isTrue(v){
    return ["TRUE","1","YES","Y"].includes(String(v??"").trim().toUpperCase());
}

function getPublisherName(p){
    return `${p.FNAME||""} ${p.LName||""}`.trim();
}

function getPublisherPrivilege(p){
    const privileges=[];
    if(isTrue(p.Elder))privileges.push("Elder");
    if(isTrue(p.MS))privileges.push("MS");
    if(isTrue(p.RP))privileges.push("RP");
    if(isTrue(p.SF)||isTrue(p.SP))privileges.push("SP");
    if(!String(p.Baptism??"").trim())privileges.push("Unbaptized");
    return privileges.join(" & ");
}


/* ============================================================
   3. TABLE RENDERING
   ------------------------------------------------------------
   ADD FUTURE TABLE DISPLAY CHANGES HERE
   ============================================================ */


/* ============================================================
   4. ACTIVE PUBLISHERS FROM INDEXEDDB
   ------------------------------------------------------------
   THIS IS THE DEFAULT ANALYSIS RESULT
   ADD/CHANGE PUBLISHER CATEGORY LOGIC HERE
   ============================================================ */
window.loadActivePublishers=async function(){
    try{
        const db=await openIndexedDB();
        const publishers=await new Promise((resolve,reject)=>{
            const req=db.transaction("PUBLISHERS","readonly").objectStore("PUBLISHERS").getAll();
            req.onsuccess=()=>resolve(req.result||[]);
            req.onerror=()=>reject(req.error);
        });
        db.close();

        const isTrue=v=>["TRUE","1","YES","Y"].includes(String(v??"").trim().toUpperCase());

        const active=publishers
            .filter(p=>["","ACTIVE"].includes(String(p.Status??"").trim().toUpperCase()))
            .sort((a,b)=>{
                const lastA=String(a.LName??"").trim().toUpperCase();
                const lastB=String(b.LName??"").trim().toUpperCase();
                const firstA=String(a.FNAME??"").trim().toUpperCase();
                const firstB=String(b.FNAME??"").trim().toUpperCase();
                return lastA.localeCompare(lastB)||firstA.localeCompare(firstB);
            });

        const tbody=document.getElementById("publishers-table-body");
        const title=document.getElementById("list-title");
        const badge=document.getElementById("ActivePubs-count");

        if(!tbody||!title){
            console.error("❌ Analysis result elements not found");
            return;
        }

        if(badge)badge.textContent=active.length;

        const colName=document.getElementById("col-name");
        const colRole=document.getElementById("col-role");
        const colStatus=document.getElementById("col-status");

        if(colName)colName.textContent="Name";
        if(colRole)colRole.textContent="Privileges";
        if(colStatus)colStatus.textContent="Years in the Truth";

        title.textContent=`ACTIVE PUBLISHERS (${active.length})`;

        const calculateYearsInTruth=baptism=>{
            if(!baptism)return "";
            const d=new Date(baptism);
            if(isNaN(d))return "";

            const now=new Date();
            let years=now.getFullYear()-d.getFullYear();
            let months=now.getMonth()-d.getMonth();

            if(months<0||(months===0&&now.getDate()<d.getDate())){
                years--;
                months+=12;
            }

            const parts=[];
            if(years>0)parts.push(`${years} year${years!==1?"s":""}`);
            if(months>0)parts.push(`${months} month${months!==1?"s":""}`);

            return parts.join(" ")||"0 months";
        };

        tbody.innerHTML=active.map(p=>{
            const privileges=[];
            if(isTrue(p.Elder))privileges.push("Elder");
            if(isTrue(p.MS))privileges.push("MS");
            if(isTrue(p.RP))privileges.push("RP");
            if(isTrue(p.SF)||isTrue(p.SP))privileges.push("SP");
            if(!String(p.Baptism??"").trim())privileges.push("Unbaptized");

            const name=`${p.LName||""}, ${p.FNAME||""}`.replace(/^,\s*/,"").trim();
            const yearsInTruth=calculateYearsInTruth(p.Baptism);

            return `<tr>
                <td><strong>${name}</strong></td>
                <td>${privileges.join(" & ")}</td>
                <td>${yearsInTruth}</td>
            </tr>`;
        }).join("");

        console.log(`✅ Active Publishers loaded: ${active.length}`);
        return active;
    }catch(err){
        console.error("❌ loadActivePublishers error:",err);
        return [];
    }
};

function filterData(category,evt){
   
    const title=document.getElementById("list-title");

    document.querySelectorAll(".dash-link")
        .forEach(btn=>btn.classList.remove("active"));

    if(evt&&evt.currentTarget){
        evt.currentTarget.classList.add("active");
    }


  if(category==="Ministerial Servants"){

        window.loadMSPublishers?.();
        return;
    }



    if(category==="Active Baptized"){
        window.loadActiveBaptizedPublishers?.();
        return;
    }

    
     if(category==="Irregular"){
        window.loadIrregularPublishers?.();
        return;
    }

    if(category==="Active"){
        window.loadActivePublishers?.();
        return;
    }

    if(category==="Unbaptized"){
        window.loadUnbaptizedPublishers?.();
        return;
    }

    if(category==="Elders"){
          window.loadElders?.();
        return;
    }


    if(category==="Regular Pioneers"){
          window.loadRP?.();
        return;
    }


    if(category==="S-88"){
        window.loadS88Attendance?.();
        return;
    }

    if(category==="CO-AVG"){
        window.open("/COReport","_blank");
         return;
    }

     if(category==="New Publishers"){
        window.loadNewPublishers?.();
         return;
    }

    renderTable(currentData);
}

/* ============================================================
   6. RESULT SEARCH
   ------------------------------------------------------------
   ADD FUTURE SEARCH CONDITIONS HERE
   ============================================================ */
function filterTableBySearch(){
    const input=document.getElementById("search-input");
    if(!input)return;

    const q=input.value.toLowerCase().trim();

    if(!q){
        renderTable(currentData);
        return;
    }

    renderTable(
        currentData.filter(i=>
            String(i.name||"").toLowerCase().includes(q)
        )
    );
}


/* ============================================================
   7. AI ASSISTANT
   ------------------------------------------------------------
   ADD FUTURE AI FUNCTIONS HERE
   ============================================================ */

async function runAiQuery() {
    const input = document.getElementById("ai-query-input");
    const tableBody = document.getElementById("publishers-table-body");
    const title = document.getElementById("list-title");

    if (!input) return;
    const query = input.value.trim();
    if (!query) return;

    if (title) title.innerText = `AI RESULT: "${query}"`;

    if (tableBody) {
        tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Processing query...</td></tr>`;
    }

    // Get your local publishers list (adjust 'allPublishers' to match your variable name)
    const localData = typeof allPublishers !== 'undefined' ? allPublishers : [];

    try {
    const response = await fetch('/api/ai-query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query })
    });

    const aiData = await response.json();

    console.log("🤖 AI Query Plan:", aiData.query_plan);

    if (aiData.query_plan && Object.keys(aiData.query_plan).length > 0) {
        try {
            const actualResults = await executeAiQueryPlan(aiData.query_plan);

            console.log("📊 IndexedDB Results:", actualResults);

            aiData.results = actualResults;
        } catch (error) {
            console.error("❌ IndexedDB AI query failed:", error);
            aiData.results = [];
            aiData.answer = "Unable to retrieve the requested records.";
        }
    }

    renderAiTableResults(aiData);

    } catch (error) {
        console.error("AI Error:", error);
        if (tableBody) {
            tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red;">Failed to get AI response.</td></tr>`;
        }
    }
}

function renderAiTableResults(data) {
    const tableBody = document.getElementById("publishers-table-body");
    if (!tableBody) return;

    tableBody.innerHTML = "";

    const records = data.results || [];

    if (!records.length) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="3" style="text-align:center;">
                    ${message}
                </td>
            </tr>
        `;
        return;
    }

    records.forEach(publisher => {
        const tr = document.createElement("tr");

        const name = [
            publisher.FNAME,
            publisher.MName,
            publisher.LName
        ].filter(value => value && String(value).trim() !== "").join(" ");

        const role = [
            publisher.Elder ? "Elder" : "",

        ].filter(Boolean).join(", ");

        const status =
            publisher.Status ||
            publisher.status ||
            publisher.Remarks ||
            "Active";

        tr.innerHTML = `
            <td>${name}</td>
            <td>${role}</td>
            <td>${status}</td>
        `;

        tableBody.appendChild(tr);

}

window.loadUnbaptizedPublishers=async function(){
    try{
        const db=await openIndexedDB();
        const publishers=await new Promise((resolve,reject)=>{
            const r=db.transaction("PUBLISHERS","readonly").objectStore("PUBLISHERS").getAll();
            r.onsuccess=()=>resolve(r.result||[]);
            r.onerror=()=>reject(r.error);
        });
        const records=await new Promise((resolve,reject)=>{
            const r=db.transaction("RECORDS","readonly").objectStore("RECORDS").getAll();
            r.onsuccess=()=>resolve(r.result||[]);
            r.onerror=()=>reject(r.error);
        });
        db.close();

        const today=new Date();
        const day=today.getDate();
        const reportDate=new Date(today.getFullYear(),today.getMonth()-(day<21?1:0),1);
        const baseDate=new Date(2025,8,1);
        const monthDiff=(reportDate.getFullYear()-baseDate.getFullYear())*12+
            (reportDate.getMonth()-baseDate.getMonth());
        const currentNumber=194+monthDiff;

        const calculateAge=birth=>{
            if(!birth)return "";
            const d=new Date(birth);
            if(isNaN(d))return "";
            let age=today.getFullYear()-d.getFullYear();
            const m=today.getMonth()-d.getMonth();
            if(m<0||(m===0&&today.getDate()<d.getDate()))age--;
            return age;
        };

        const calculateUnbaptizedTime=startNumber=>{
            const months=currentNumber-Number(startNumber);
            if(months<0)return "";
            const years=Math.floor(months/12);
            const remainingMonths=months%12;
            const parts=[];
            if(years>0)parts.push(`${years} year${years!==1?"s":""}`);
            if(remainingMonths>0)parts.push(`${remainingMonths} month${remainingMonths!==1?"s":""}`);
            return parts.join(" ")||"0 months";
        };

        const unbaptized=publishers
            .filter(p=>String(p.Baptism??"").trim()==="")
            .filter(p=>String(p.LName??"").trim()||String(p.FNAME??"").trim())
            .sort((a,b)=>{
                const la=String(a.LName??"").trim().toUpperCase();
                const lb=String(b.LName??"").trim().toUpperCase();
                const fa=String(a.FNAME??"").trim().toUpperCase();
                const fb=String(b.FNAME??"").trim().toUpperCase();
                return la.localeCompare(lb)||fa.localeCompare(fb);
            });

        const title=document.getElementById("list-title");
        const badge=document.getElementById("unbaptized-count");

        if(!title){
            console.error("❌ Analysis result elements not found");
            return [];
        }

        if(badge)badge.textContent=unbaptized.length;

        title.textContent=`UNBAPTIZED PUBLISHERS (${unbaptized.length})`;

        const rows=unbaptized.map(p=>{
            const pubId=String(p.IDPub??"").trim();

            const rec=records
                .filter(r=>String(r.IdPubs??"").trim()===pubId)
                .filter(r=>{
                    const remark=String(r.REMARKS??"").trim().toUpperCase();
                    return remark==="NEW UPB"||remark==="NEW UBP";
                })
                .sort((a,b)=>Number(a.NUMBER)-Number(b.NUMBER))[0];

            const name=`${p.LName||""}, ${p.FNAME||""}`
                .replace(/^,\s*/,"").trim();

            const yearsUnbaptized=rec
                ?calculateUnbaptizedTime(rec.NUMBER)
                :"";

            return {
                name,
                age:calculateAge(p.Birthdate),
                yearsUnbaptized
            };
        });

        setAnalysisTable([
            {
                label:"Name",
                render:row=>`<strong>${row.name}</strong>`
            },
            {
                label:"Age",
                render:row=>row.age
            },
            {
                label:"Years as Unbaptized",
                render:row=>row.yearsUnbaptized
            }
        ],rows);

        console.log("✅ Current reporting NUMBER:",currentNumber);
        console.log("✅ Unbaptized publishers:",unbaptized.length);

        return unbaptized;
    }catch(err){
        console.error("❌ loadUnbaptizedPublishers error:",err);
        return [];
    }
};

            req.onsuccess=()=>resolve(req.result||[]);
            req.onerror=()=>reject(req.error);
        });

        db.close();

        const firstNumber=Number(period.firstNumber);
        const lastNumber=Number(period.lastNumber);

        const rpPublishers=publishers
            .filter(p=>String(p.RP??"").trim().toUpperCase()==="TRUE")
            .filter(p=>{
                const status=String(p.Status??"").trim().toUpperCase();
                return status==="ACTIVE"||status==="";
            })
            .filter(p=>String(p.LName??"").trim()||String(p.FNAME??"").trim())
            .sort((a,b)=>{
                const lastA=String(a.LName??"").trim().toUpperCase();
                const lastB=String(b.LName??"").trim().toUpperCase();
                const firstA=String(a.FNAME??"").trim().toUpperCase();
                const firstB=String(b.FNAME??"").trim().toUpperCase();
                return lastA.localeCompare(lastB)||firstA.localeCompare(firstB);

window.loadIrregularPublishers=async function(){
    try{
        const period=await window.getSixMonthReportingPeriod();
        if(!period){
            console.warn("⚠️ Reporting period unavailable");
            return [];
        }

        const db=await openIndexedDB();
        const tx=db.transaction(["PUBLISHERS","RECORDS"],"readonly");

        const publishers=await new Promise((resolve,reject)=>{
            const r=tx.objectStore("PUBLISHERS").getAll();
            r.onsuccess=()=>resolve(r.result||[]);
            r.onerror=()=>reject(r.error);
        });

        const records=await new Promise((resolve,reject)=>{
            const r=tx.objectStore("RECORDS").getAll();
            r.onsuccess=()=>resolve(r.result||[]);
            r.onerror=()=>reject(r.error);
        });

        db.close();

        const months=period.sixMonths.map(r=>Number(r.NUMBER));

        const activePublishers=publishers.filter(p=>{
            const status=String(p.Status??"").trim().toUpperCase();
            return status==="ACTIVE"||status==="";
        });

        const getStartNumber=id=>{
            const rows=records
                .filter(r=>String(r.IdPubs)===String(id))
                .filter(r=>{
                    const remark=String(r.REMARKS??"").trim().toUpperCase();
                    return ["NEW UPB","NEW UBP","UPB","UBP"].includes(remark);
                })
                .sort((a,b)=>Number(a.NUMBER)-Number(b.NUMBER));

            return rows.length?Number(rows[0].NUMBER):null;
        };

        const isReported=r=>{
            const ministry=String(r?.MINISTRY??"").trim();
            return ministry==="1"||ministry==="?";
        };

        const irregular=[];

        for(const p of activePublishers){
            const startNumber=getStartNumber(p.IDPub);
            const applicableMonths=months.filter(
                n=>startNumber==null||n>=startNumber
            );

            if(!applicableMonths.length)continue;

            const reported=[];
            const missed=[];

            for(const n of applicableMonths){
                const recs=records.filter(r=>
                    String(r.IdPubs)===String(p.IDPub)&&
                    Number(r.NUMBER)===n
                );

                if(recs.some(isReported)){
                    reported.push(n);
                }else{
                    missed.push(n);
                }
            }

            if(missed.length>0){
                const monthName=n=>{
                    return period.sixMonths.find(
                        x=>Number(x.NUMBER)===Number(n)
                    )?.MONTH_||"";
                };

                irregular.push({
                    IDPub:p.IDPub,
                    Name:`${p.LName||""}, ${p.FNAME||""} (FSG ${p.GROUP||""})`
                        .replace(/^,\s*/,"").trim(),
                    StartNumber:startNumber??"Not Found",
                    ApplicableMonths:applicableMonths.length,
                    Reported:reported.length,
                    Missed:missed.length,
                    MissedMonths:missed.map(monthName).join(", ")
                });
            }
        }

        irregular.sort((a,b)=>a.Name.localeCompare(b.Name));

        const title=document.getElementById("list-title");
        const badge=document.getElementById("Irregular-count");

        if(!title){
            console.error("❌ Analysis result elements not found");
            return irregular;
        }

        if(badge)badge.textContent=irregular.length;

        title.textContent=`IRREGULAR PUBLISHERS (${irregular.length})`;

        const rows=irregular.map(p=>({
            name:p.Name,
            missedMonths:p.MissedMonths
        }));

        setAnalysisTable([
            {
                label:"Name",
                render:row=>`<strong>${row.name}</strong>`
            },
            {
                label:"Missed Months",
                render:row=>row.missedMonths
            }
        ],rows);

        console.log(`✅ 6-Month Irregular Publishers loaded: ${irregular.length}`);
        console.log("📅 Reporting period:",months.join(", "));
        console.table(irregular);

        return irregular;
    }catch(err){
        console.error("❌ loadIrregularPublishers error:",err);
        return [];
    }
};

                    <td style="${compactCell}width:25%;text-align:center;">
                        ${makeInput(number,"AttendcMidweekTotal",record?.AttendcMidweekTotal)}
                    </td>
                    <td style="${compactCell}width:25%;text-align:center;" id="s88-midweek-avg-${number}">
                        ${makeAverage(number,"midweek")}
                    </td>
                </tr>
            `;
        });

        html+=`
            <tr>
                <td colspan="4" style="height:3px;background:#ddd;padding:0;"></td>
            </tr>
            <tr>
                <td colspan="4" style="text-align:center;font-weight:bold;background:#f3f3f3;padding:2px;font-size:10px;">
                    WEEKEND MEETING
                </td>
            </tr>
            <tr style="font-size:9px;font-weight:bold;text-align:center;height:20px;">
                <td style="width:25%;padding:1px;">MONTH</td>
                <td style="width:25%;padding:1px;">NO. OF MEETINGS</td>
                <td style="width:25%;padding:1px;">TOTAL ATTENDANCE</td>
                <td style="width:25%;padding:1px;">AVERAGE</td>
            </tr>
        `;

        // WEEKEND
        period.sixMonths.forEach(month=>{
            const number=Number(month.NUMBER);
            const record=getRecord(number);

            html+=`
                <tr>
                    <td style="${compactCell}width:25%;">
                        <strong>${month.MONTH_||""}</strong>
                    </td>
                    <td style="${compactCell}width:25%;text-align:center;">
                        ${makeInput(number,"NoMtgs2",record?.NoMtgs2)}
                    </td>
                    <td style="${compactCell}width:25%;text-align:center;">
                        ${makeInput(number,"AttendcPublickTotal",record?.AttendcPublickTotal)}
                    </td>
                    <td style="${compactCell}width:25%;text-align:center;" id="s88-weekend-avg-${number}">
                        ${makeAverage(number,"weekend")}
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML=html;

        // Recalculate average immediately while typing
        tbody.querySelectorAll("input").forEach(input=>{
     input.addEventListener("input",async function(){
        const number=Number(this.dataset.s88Number);
        const field=this.dataset.s88Field;
        const value=this.value;
        const midweekMeetings=tbody.querySelector(`[data-s88-number="${number}"][data-s88-field="NoMtgs1"]`);
        const midweekAttendance=tbody.querySelector(`[data-s88-number="${number}"][data-s88-field="AttendcMidweekTotal"]`);
        const weekendMeetings=tbody.querySelector(`[data-s88-number="${number}"][data-s88-field="NoMtgs2"]`);
        const weekendAttendance=tbody.querySelector(`[data-s88-number="${number}"][data-s88-field="AttendcPublickTotal"]`);
        const midweekAvg=document.getElementById(`s88-midweek-avg-${number}`);
        const weekendAvg=document.getElementById(`s88-weekend-avg-${number}`);
        const mwM=Number(midweekMeetings?.value||0);
        const mwA=Number(midweekAttendance?.value||0);
        const weM=Number(weekendMeetings?.value||0);
        const weA=Number(weekendAttendance?.value||0);
        if(midweekAvg)midweekAvg.textContent=mwM>0&&mwA>0?Math.round(mwA/mwM):"";
        if(weekendAvg)weekendAvg.textContent=weM>0&&weA>0?Math.round(weA/weM):"";

        try{
            const db=await openIndexedDB();
            const tx=db.transaction("MonthlyRecords","readwrite");
            const store=tx.objectStore("MonthlyRecords");
            const getReq=store.get(number);

            getReq.onsuccess=()=>{
                const record=getReq.result;
                if(!record){
                    console.warn(`⚠️ MonthlyRecords NUMBER ${number} not found`);
                    return;
                }

                record[field]=value;
                store.put(record);

                console.log(`💾 S-88 saved: NUMBER=${number}, ${field}=${value}`);
            };

            getReq.onerror=()=>{
                console.error(`❌ Failed to read MonthlyRecords NUMBER ${number}`,getReq.error);
            };

            tx.oncomplete=()=>{
                db.close();
            };

            tx.onerror=()=>{
                console.error(`❌ Failed to save S-88 NUMBER ${number}`,tx.error);
                db.close();
            };
        }catch(err){
            console.error("❌ S-88 IndexedDB save error:",err);
        }

        if(typeof window.setSyncUnsaved==="function")window.setSyncUnsaved();
          });
      });

        console.log("✅ S-88 Attendance loaded");
        console.log("📅 Reporting months:",period.sixMonths.map(r=>r.MONTH_).join(", "));

    }catch(err){
        console.error("❌ loadS88Attendance error:",err);
    }
};



window.loadNewPublishers=async function(){
    try{
        const period=await window.getSixMonthReportingPeriod();

        const serviceYearEl=document.getElementById("analysis-service-year");
        if(serviceYearEl)serviceYearEl.textContent="";

        const title=document.getElementById("list-title");
        const header=document.getElementById("analysis-table-header");
        const tbody=document.getElementById("publishers-table-body");

        if(!title||!header||!tbody){
            console.error("❌ New Publishers table elements not found");
            return;
        }

      
       

        header.innerHTML="";

        const db=await openIndexedDB();
        const tx=db.transaction(["RECORDS","PUBLISHERS"],"readonly");

        const records=await new Promise((resolve,reject)=>{
            const r=tx.objectStore("RECORDS").getAll();
            r.onsuccess=()=>resolve(r.result||[]);
            r.onerror=()=>reject(r.error);
        });

        const publishers=await new Promise((resolve,reject)=>{
            const r=tx.objectStore("PUBLISHERS").getAll();
            r.onsuccess=()=>resolve(r.result||[]);
            r.onerror=()=>reject(r.error);
        });

        db.close();

        const firstNumber=Number(period.firstNumber);
        const lastNumber=Number(period.lastNumber);

        const newPublishers=records
            .filter(r=>{
                const remark=String(r.REMARKS??"").trim().toUpperCase();
                
                const number=Number(r.NUMBER);

                return remark==="NEW UBP" &&
                       number>=firstNumber &&
                       number<=lastNumber;
            })
            .map(r=>{
                const p=publishers.find(p=>
                    String(p.IDPub)===String(r.IdPubs)
                );

                return {record:r,publisher:p};
            })
            .filter(x=>{
                if(!x.publisher)return false;

                const status=String(x.publisher.Status??"")
                    .trim()
                    .toUpperCase();

                return status==="ACTIVE"||status==="";
            })
            .sort((a,b)=>Number(a.record.NUMBER)-Number(b.record.NUMBER));

            const upbCount=document.getElementById("UPB-count");
            if(upbCount)upbCount.textContent=newPublishers.length;

              title.textContent=`NEW PUBLISHERS(${newPublishers.length})`;

        const columns=[
            {
                label:"Name",
                render:x=>{
                    const p=x.publisher;
                    return `<strong>${p.LName||""}, ${p.FNAME||""}</strong>`;
                }
            },
            {
                label:"Month Started",
                render:x=>{
                    const month=period.sixMonths.find(m=>
                        Number(m.NUMBER)===Number(x.record.NUMBER)
                    );
                    return month?.MONTH_||"";
                }
            }
        ];

        header.innerHTML=columns
            .map(col=>`<th>${col.label}</th>`)
            .join("");

        tbody.innerHTML=newPublishers.length
            ?newPublishers.map(x=>`
                <tr>
                    ${columns.map(col=>`
                        <td>${col.render(x)}</td>
                    `).join("")}
                </tr>
            `).join("")
            :`<tr>
                <td colspan="${columns.length}" style="text-align:center;">
                    No new publishers
                </td>
            </tr>`;

        console.log("✅ New Publishers loaded:",{
            firstNumber,
            lastNumber,
            count:newPublishers.length
        });

    }catch(error){
        console.error("❌ loadNewPublishers error:",error);
    }
};



</script>
