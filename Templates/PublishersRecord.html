        padding: 2px;

    .listbox-item {
        padding: 4px 6px;

        user-select: none;

    .listbox-item:hover {
        background-color: #f1f1f1 !important; /* Change to transparent if you want zero color change */
        color: inherit !important;
    }

    /* Style for the active/selected item */
    .listbox-item.active {
        background-color: #007bff !important; /* Change this to your preferred selection color or match your theme */
        color: white !important;

    .listbox-count {

        align-items: center;

    .s21-table {
        table-layout: fixed;
        width: 100%;
        border-collapse: collapse;

        border: 1px solid #222;
        padding: 0px 3px;
        font-size: 11px;
        vertical-align: middle;
        height: var(--row-height);
    }

        background-color: #aeabab;
        text-align: center;
        font-weight: bold;
        line-height: 1.1;
        padding: 2px;
    }

        font-weight: normal;

                    <input type="text" class="remark-text" id="${m.id}-remark" data-month="${index}">

        request.onerror = (event) => {

        };
        
        request.onsuccess = (event) => {
            const db = event.target.result;
            const storeNames = Array.from(db.objectStoreNames);
            const targetStore = storeNames.find(name => name.toUpperCase() === "PUBLISHERS");
            
            if (!targetStore) {
                console.error("Could not find a publishers table in IndexedDB.");
                return;
            }
            
            const transaction = db.transaction([targetStore], "readonly");
            const store = transaction.objectStore(targetStore);
            const getAllRequest = store.getAll();
            
            getAllRequest.onsuccess = () => {
                publishersData = getAllRequest.result || [];
                console.log("Publishers successfully loaded:", publishersData.length);
                renderListbox();
            };
            
            getAllRequest.onerror = (event) => {
                console.error("Error retrieving publishers:", event.target.error);
            };
        };
    }

function savePublisherChanges() {
    if (!currentSelectedPublisher || !currentSelectedPublisher.IDPub) {
        console.warn("⚠️ Cannot save: No publisher selected.");
        return;
    }
    
    // NOTE: Removed the faulty name-splitting lines here! 
    // The expandable name editor already handles LName, FNAME, and MName correctly.

    // Save name fields from expandable editor
    currentSelectedPublisher.LName = document.getElementById('editLName')?.value.trim() || currentSelectedPublisher.LName || "";
    currentSelectedPublisher.FNAME = document.getElementById('editFName')?.value.trim() || currentSelectedPublisher.FNAME || "";
    currentSelectedPublisher.MName = document.getElementById('editMName')?.value.trim() || currentSelectedPublisher.MName || "";
    currentSelectedPublisher.Fullname = `${currentSelectedPublisher.LName}, ${currentSelectedPublisher.FNAME}${currentSelectedPublisher.MName ? " " + currentSelectedPublisher.MName : ""}`;

    // Gather other form values into currentSelectedPublisher
    currentSelectedPublisher.Birthdate = document.getElementById('pubDob').value;
    currentSelectedPublisher.Baptism = document.getElementById('pubBaptism').value;
    
    const groupVal = document.getElementById('pubGroup')?.value || "";
    currentSelectedPublisher.GROUP = groupVal; 
    
    const maleEl = document.getElementById('isMale');
    const femaleEl = document.getElementById('isFemale');
    currentSelectedPublisher.Male = maleEl && maleEl.checked ? '1' : '0';
    currentSelectedPublisher.Female = femaleEl && femaleEl.checked ? '1' : '0';
    
    const statusEl = document.getElementById('pubStatus');
    currentSelectedPublisher.Status = statusEl ? statusEl.value : ""; 
    
    // Save active checkbox properties mapped correctly to HTML IDs
    currentSelectedPublisher.Elder = document.getElementById('isElder')?.checked ? "1" : "0";
    currentSelectedPublisher.MS = document.getElementById('isMS')?.checked ? "1" : "0";
    currentSelectedPublisher.RP = document.getElementById('isRP')?.checked ? "1" : "0";
    currentSelectedPublisher.SF = document.getElementById('isSP')?.checked ? "1" : "0"; 
    
    const request = indexedDB.open("CongregationDB");
    request.onsuccess = (event) => {
        const db = event.target.result;
        const transaction = db.transaction(["PUBLISHERS"], "readwrite");
        const store = transaction.objectStore("PUBLISHERS");
        
        const cursorRequest = store.openCursor();
        let foundAndUpdated = false;
        
        cursorRequest.onsuccess = (e) => {
            const cursor = e.target.result;
            if (cursor) {
                if (String(cursor.value.IDPub) === String(currentSelectedPublisher.IDPub)) {
                    const updateRequest = cursor.update(currentSelectedPublisher);
                    updateRequest.onsuccess = () => {
                        console.log(`✅ Successfully updated publisher (IDPub: ${currentSelectedPublisher.IDPub}) at internal key: ${cursor.value.id}`);
                        foundAndUpdated = true;
                    };
                    updateRequest.onerror = (err) => {
                        console.error("❌ Error updating record via cursor:", err.target.error);
                    };
                    return;
                }
                cursor.continue();
            } else {
                if (!foundAndUpdated) {
                    console.warn("⚠️ IDPub match not found via cursor, performing standard put...");
                    store.put(currentSelectedPublisher);
                }
            }
        };
        
        cursorRequest.onerror = (e) => {
            console.error("❌ Cursor error:", e.target.error);
        };
        
        transaction.oncomplete = () => {
            console.log("🔒 Transaction completed successfully.");
            
            // 1. Capture active ID before listbox re-renders
            const activeId = currentSelectedPublisher ? currentSelectedPublisher.IDPub : null;       
            const searchVal = document.getElementById('publisherSearch')?.value || "";
            const catVal = document.getElementById('categorySelect')?.value || "ALL";
            renderListbox(searchVal, catVal);
            
            // 2. Attempt to restore selection with detailed logs
            if (activeId) {
                setTimeout(() => {
                    const items = document.querySelectorAll('.listbox-item, [data-id]');
                    console.log(`🔍 Searching through ${items.length} rendered list items to restore selection for IDPub: ${activeId}`);
                    
                    let found = false;
                    items.forEach(item => {
                        const itemId = item.dataset.id || item.getAttribute('data-id');
                        if (String(itemId) === String(activeId)) {
                            console.log("✅ Found matching listbox item in DOM. Simulating click to restore selection.");
                            item.click();
                            found = true;
                        }
                    });
                    
                    if (!found) {
                        console.warn(`⚠️ Could not find listbox item with IDPub ${activeId} after re-rendering.`);
                    }
                }, 50);
            }
        };
        
        transaction.onerror = (e) => {
            console.error("❌ Transaction failed:", e.target.error);
        };
    };
}

        const hrsEl = document.getElementById(`${m.id}-hours`);
        const remTextEl = document.getElementById(`${m.id}-remark`);
        const remSelEl = document.getElementById(`${m.id}-select`);

        // Bind the publisher ID directly to every input element in this row
        [minEl, bsEl, auxEl, hrsEl, remTextEl, remSelEl].forEach(el => {
            if (el) el.dataset.publisherId = activePublisherId;
        });

        // Clear values first
        if (minEl) minEl.checked = false;
        if (bsEl) bsEl.value = "";
        if (auxEl) auxEl.checked = false;
        if (hrsEl) hrsEl.value = "";
        if (remTextEl) remTextEl.value = "";
        if (remSelEl) remSelEl.value = "";
    });

    const request = indexedDB.open("CongregationDB");

    request.onsuccess = (event) => {
        const db = event.target.result;
        const transaction = db.transaction(["RECORDS"], "readonly");
        const store = transaction.objectStore("RECORDS");
        
        // BULK FETCH: Grab all records in one fast trip instead of using a cursor loop
        const getAllRequest = store.getAll();
        
        getAllRequest.onsuccess = (e) => {
            const allRecords = e.target.result;

            // IN-MEMORY MAP: Filter records belonging to this publisher and map them by NUMBER
            const publisherRecordMap = new Map();
            allRecords.forEach(rec => {
                if (String(rec.IdPubs) === String(activePublisherId)) {
                    publisherRecordMap.set(Number(rec.NUMBER), rec);
                }
            });

            // INSTANT RENDER: Loop through months and grab data from memory map securely
            s21Months.forEach((m, index) => { // 💡 'index' parameter correctly mapped
                const targetNumber = getServiceMonthNumber(selectedYear, index);
                const rec = publisherRecordMap.get(Number(targetNumber));

                const minEl = document.getElementById(`${m.id}-ministry`);
                const bsEl = document.getElementById(`${m.id}-studies`);
                const auxEl = document.getElementById(`${m.id}-aux`);
                const hrsEl = document.getElementById(`${m.id}-hours`);
                const remTextEl = document.getElementById(`${m.id}-remark`);
                const remSelEl = document.getElementById(`${m.id}-select`);

                if (rec) {
                    if (minEl) minEl.checked = Boolean(rec.MINISTRY);
                    if (bsEl) bsEl.value = rec.BS !== undefined ? rec.BS : "";
                    if (auxEl) auxEl.checked = Boolean(rec.AUX);
                    if (hrsEl) hrsEl.value = rec.HRS !== undefined ? rec.HRS : "";
                    
                    // SAFE CASING FALLBACKS FOR REMARKS
                    if (remTextEl) remTextEl.value = rec.Note || rec.note || rec.REMARK || "";
                    if (remSelEl) remSelEl.value = rec.REMARKS || rec.remarks || rec.Remark || "";
                }

                // Attach listeners using the correct 'index' variable
                attachS21AutoCheckListeners(index, m);
            });
        };

        getAllRequest.onerror = (err) => {
            console.error("❌ Failed to bulk load publisher records:", err.target.error);
        };

        // Calculate total hours once the transaction finishes loading all months
        transaction.oncomplete = () => {
            calculateTotalHours();
        };
    };
}

// Automatically inserts a new record or updates an existing one
async function saveS21MonthRecord(monthIndex, eventTarget) {

    const targetPublisherId =
        eventTarget?.dataset?.publisherId ||
        window.selectedPubId;

    if (!targetPublisherId) {
        console.warn("⚠️ S21 SAVE: No publisher ID");
        return;
    }

    const m = s21Months[monthIndex];
    if (!m) {
        console.warn("⚠️ S21 SAVE: Invalid month index", monthIndex);
        return;
    }

    const targetNumber =
        getServiceMonthNumber(selectedYear, monthIndex);

    // ---------------------------------------------------------
    // READ VALUES FROM HTML
    // ---------------------------------------------------------

    const ministryEl =
        document.getElementById(`${m.id}-ministry`);

    const studiesEl =
        document.getElementById(`${m.id}-studies`);

    const auxEl =
        document.getElementById(`${m.id}-aux`);

    const hoursEl =
        document.getElementById(`${m.id}-hours`);

    const noteEl =
        document.getElementById(`${m.id}-remark`);

    const remarksEl =
        document.getElementById(`${m.id}-select`);

    const ministryVal =
        ministryEl?.checked ? 1 : 0;

    const bsVal =
        studiesEl?.value
            ? Number(studiesEl.value)
            : "";

    const auxVal =
        auxEl?.checked ? 1 : 0;

    const hrsVal =
        hoursEl?.value
            ? Number(hoursEl.value)
            : "";

    // THIS is the Note field
    const noteVal =
        noteEl?.value?.trim() || "";

    // THIS is the dropdown REMARKS field
    const remarksVal =
        remarksEl?.value || "";

    const hasData =
        ministryVal ||
        bsVal ||
        auxVal ||
        hrsVal ||
        noteVal ||
        remarksVal;

    // ---------------------------------------------------------
    // DATE ENTERED = ACTIVE REPORTING MONTH
    // ---------------------------------------------------------

    const activeMonthIndex = Number(
        window.currentActiveMonthIndex ??
        (
            typeof window.getMonthIndex === "function"
                ? window.getMonthIndex()
                : monthIndex
        )
    );

    const dateEntered =
        getServiceMonthNumber(
            selectedYear,
            activeMonthIndex
        );

    console.log("💾 S21 SAVE:", {
        publisher: targetPublisherId,
        monthIndex,
        targetNumber,
        ministry: ministryVal,
        studies: bsVal,
        aux: auxVal,
        hours: hrsVal,
        NOTE: noteVal,
        REMARKS: remarksVal,
        activeMonthIndex,
        Date_entered: dateEntered
    });

    // ---------------------------------------------------------
    // INDEXEDDB
    // RECORDS KEY = [NUMBER, IdPubs]
    // ---------------------------------------------------------

    const db = await openIndexedDB();

    try {

        const transaction =
            db.transaction(["RECORDS"], "readwrite");

        const store =
            transaction.objectStore("RECORDS");

        const key = [
            targetNumber,
            String(targetPublisherId)
        ];

        const existing =
            await new Promise((resolve, reject) => {

                const request = store.get(key);

                request.onsuccess = () => {
                    resolve(request.result || null);
                };

                request.onerror = () => {
                    reject(request.error);
                };
            });

        console.log("🔎 Existing S21 record:", existing);

        // -----------------------------------------------------
        // NO DATA → DELETE EXISTING RECORD
        // -----------------------------------------------------

        if (!hasData) {

            if (existing) {

                await new Promise((resolve, reject) => {

                    const request = store.delete(key);

                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);

                });

                console.log(
                    `🗑️ Deleted empty record: ${targetPublisherId}-${targetNumber}`
                );
            }

            return;
        }

        // -----------------------------------------------------
        // UPDATE EXISTING RECORD
        // -----------------------------------------------------

        if (existing) {

            existing.MINISTRY = ministryVal;
            existing.BS = bsVal;
            existing.AUX = auxVal;
            existing.HRS = hrsVal;

            // IMPORTANT
            existing.Note = noteVal;

            existing.REMARKS = remarksVal;
            existing.Date_entered = dateEntered;

            await new Promise((resolve, reject) => {

                const request = store.put(existing);

                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);

            });

            console.log(
                `✏️ Updated S21 record: ${targetPublisherId}-${targetNumber}`,
                {
                    Note: existing.Note,
                    REMARKS: existing.REMARKS
                }
            );

        }

        // -----------------------------------------------------
        // CREATE NEW RECORD
        // -----------------------------------------------------

        else {

            const payload = {
                IdPubs: String(targetPublisherId),
                NUMBER: targetNumber,
                MINISTRY: ministryVal,
                BS: bsVal,
                AUX: auxVal,
                HRS: hrsVal,

                // IMPORTANT
                Note: noteVal,

                REMARKS: remarksVal,
                Date_entered: dateEntered
            };

            await new Promise((resolve, reject) => {

                const request = store.add(payload);

                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);

            });

            console.log(
                `➕ Added S21 record: ${targetPublisherId}-${targetNumber}`,
                {
                    Note: noteVal,
                    REMARKS: remarksVal
                }
            );
        }

    } catch (error) {

        console.error(
            "❌ S21 IndexedDB save failed:",
            error
        );

    } finally {

        db.close();
    }
}

// AUTO-CHECK & AUTO-REMARK LISTENER HELPER
// -------------------------------------------------------------
function attachS21AutoCheckListeners(monthIndex, m) {
    const minEl = document.getElementById(`${m.id}-ministry`);
    const bsEl = document.getElementById(`${m.id}-studies`);
    const hrsEl = document.getElementById(`${m.id}-hours`);
    const auxEl = document.getElementById(`${m.id}-aux`);
    const remSelEl = document.getElementById(`${m.id}-select`);
    const noteEl = document.getElementById(`${m.id}-remark`);

    if (!minEl || !bsEl || !hrsEl) {
        console.warn(`⚠️ S-21 elements missing for ${m.id}`);
        return;
    }

    if (minEl.dataset.s21Bound === "true") return;
    minEl.dataset.s21Bound = "true";

    const handleAutoLogic = async () => {
        const publisherId = minEl.dataset.publisherId || window.selectedPubId;
        if (!publisherId) {
            console.warn("⚠️ No publisher ID found.");
            return;
        }

        // Auto-check Ministry when Studies or Hours are entered
        if (Number(bsEl.value) > 0 || Number(hrsEl.value) > 0) {
            minEl.checked = true;
        }

        // Auto-set RP remark for RP publishers
        if (remSelEl && !remSelEl.value) {
            const db = await openIndexedDB();
            const pub = await new Promise((resolve, reject) => {
                const req = db.transaction("PUBLISHERS", "readonly")
                    .objectStore("PUBLISHERS")
                    .get(String(publisherId));
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
            db.close();

            const isTrue = v => ["1","TRUE","YES","Y","?","-1"].includes(String(v ?? "").trim().toUpperCase());
            if (pub && isTrue(pub.RP)) remSelEl.value = "RP";
        }

        // Save only through IndexedDB
        if (typeof saveS21MonthRecord === "function") {
            await saveS21MonthRecord(monthIndex, minEl);
        }

        if (typeof calculateMonthlySummaryMetrics === "function") {
            calculateMonthlySummaryMetrics();
        }
    };

    // Debounce rapid changes
    const debounced = () => {
        clearTimeout(minEl._s21Timer);
        minEl._s21Timer = setTimeout(handleAutoLogic, 200);
    };

    [minEl, bsEl, hrsEl, auxEl, noteEl, remSelEl].forEach(el => {    
        if (el) el.addEventListener("change", debounced);
    });

    console.log(`✅ S-21 listener attached: ${m.name} (${monthIndex})`);
}

// 1. Reusable calculation function
function calculateTotalHours() {
    let total = 0;
    document.querySelectorAll('.hours-input').forEach(el => {
        total += parseFloat(el.value) || 0;
    });
    
    // Clean up floating-point decimals (e.g., 5.300000001 -> 5.3)
    total = Math.round(total * 100) / 100;

    const totalHoursEl = document.getElementById('totalHours');
    if (totalHoursEl) {
        totalHoursEl.value = total;
    }
}

function cleanS21Records() {
    if (!window.recordsData || !Array.isArray(window.recordsData)) {
        console.warn("⚠️ [cleanS21Records]: window.recordsData is not initialized or not an array.");
        return [];
    }

    const initialCount = window.recordsData.length;

    const isTrueMarker = (val) => {
        if (val === null || val === undefined) return false;
        if (typeof val === "boolean") return val;
        if (typeof val === "number") return val === 1 || val === -1;
        const str = String(val).trim().toUpperCase();
        return ["1", "Y", "YES", "TRUE", "-1"].includes(str);
    };

    window.recordsData = window.recordsData.filter((rec, index) => {
        // 1. Check for missing Publisher ID or NUMBER
        const pubId = rec.IdPubs ?? rec.IDPub ?? rec.idpubs;
        const hasPubId = pubId !== null && pubId !== undefined && String(pubId).trim() !== "";
        const hasNumber = rec.NUMBER !== null && rec.NUMBER !== undefined && !isNaN(Number(rec.NUMBER));

        if (!hasPubId || !hasNumber) {
            console.log(`🗑️ [Record Removed - Missing PubID/NUMBER] Index ${index}:`, rec);
            return false;
        }

        // 2. Check for service activity, remarks, and AUX status
        const hasMinistry = isTrueMarker(rec.MINISTRY);
        const hasHours = Number(rec.HRS) > 0;
        const hasStudies = Number(rec.BS) > 0;
        const hasServiceActivity = hasMinistry || hasHours || hasStudies;

        const hasRemarks = rec.REMARKS !== null && rec.REMARKS !== undefined && String(rec.REMARKS).trim() !== "";
        const isAux = isTrueMarker(rec.AUX);

        // Record is considered garbage if it has NO service activity AND NO remarks AND is NOT AUX:1
        const isGarbage = !hasServiceActivity && !hasRemarks && !isAux;

        if (isGarbage) {
            console.log(`🗑️ [Record Removed - Garbage/Empty] Index ${index}:`, rec);
            return false;
        }

        return true;
    });

    const removedCount = initialCount - window.recordsData.length;
    console.log(`🧹 [Clean Completed]: Removed ${removedCount} records. Total remaining: ${window.recordsData.length}`);

    // Optionally recalculate UI metrics if function is available
    if (typeof calculateMonthlySummaryMetrics === 'function') {
        calculateMonthlySummaryMetrics();
    }

    return window.recordsData;
}

/**
 * Automatically calculates and updates summary metrics from IndexedDB 'RECORDS'
 * filtered by matching Date_entered with the selected MonthIndex.
 * 
 * @param {number|string} [overrideMonthIndex] - Optional MonthIndex override
 */
function calculateMonthlySummaryMetrics(overrideMonthIndex) {
    const targetMonthIndex = Number(overrideMonthIndex ?? window.getMonthIndex());

    if (isNaN(targetMonthIndex)) {
        console.warn("⚠️ Aborted summary calculation: Invalid month index.");
        return;
    }

openCongregationDB((db) => {
        const storeNames = Array.from(db.objectStoreNames);
        const targetStore = storeNames.find(name => 
            name.toUpperCase() === "RECORDS" || name.toUpperCase() === "S21RECORDS"
        ) || "RECORDS";

        const pubStore = storeNames.find(name => 
            name.toUpperCase() === "PUBLISHERS"
        ) || "PUBLISHERS";

        if (!db.objectStoreNames.contains(targetStore)) {
            console.error(`❌ Store '${targetStore}' not found in CongregationDB.`);
            return;
        }

        const storesToOpen = [targetStore];
        const hasPubStore = db.objectStoreNames.contains(pubStore);
        if (hasPubStore) storesToOpen.push(pubStore);

        const transaction = db.transaction(storesToOpen, "readonly");
        const recordsReq = transaction.objectStore(targetStore).getAll();
        const pubsReq = hasPubStore ? transaction.objectStore(pubStore).getAll() : null;

        let recordsData = null;
        let publishersDataLocal = window.publishersData || [];

        const processJoinAndSummary = () => {
            if (recordsData === null) return;

            // 1. Map publishers by IDPub / IdPubs
            const publisherMap = new Map();
            publishersDataLocal.forEach(p => {
                const pubId = String(p.IDPub ?? p.IdPubs ?? "").trim();
                if (pubId) {
                    publisherMap.set(pubId, {
                        ...p,
                        fullName: `${p.LName || ''}, ${p.FNAME || ''}`.trim()
                    });
                }
            });

            // 2. Filter records matching MonthIndex (Date_entered or NUMBER)
            const monthRecords = recordsData.filter(r => 
                Number(r.Date_entered ?? r.NUMBER) === targetMonthIndex
            );

            // Robust helper for legacy database boolean flags ("?", "1", "Y", "YES", "TRUE", -1, true, 1)
            const isTrueMarker = (val) => {
                if (val === null || val === undefined) return false;
                if (typeof val === "boolean") return val;
                if (typeof val === "number") return val !== 0;
                const str = String(val).trim().toUpperCase();
                return ["?", "1", "Y", "YES", "TRUE", "-1"].includes(str);
            };

            const summary = {
                pub:   { reports: 0, hours: 0, studies: 0, details: [] },
                aux:   { reports: 0, hours: 0, studies: 0, details: [] },
                rp:    { reports: 0, hours: 0, studies: 0, details: [] },
                total: { reports: 0, hours: 0, studies: 0 }
            };

            const processedAuxPubs = new Set();
            const processedRpPubs = new Set();
            const processedPubs = new Set();

            monthRecords.forEach((rec, idx) => {
                const pubIdRaw = String(rec.IdPubs ?? rec.IDPub ?? rec.idpubs ?? "").trim();
                // Avoid dropping unlinked records during Set deduplication
                const pubId = pubIdRaw || `unlinked_${idx}`;
                const publisher = publisherMap.get(pubIdRaw) || { fullName: "Unknown / Unlinked Publisher", IDPub: pubIdRaw };

                const hours = Number(rec.HRS || rec.Hours || 0);
                const studies = Number(rec.BS || rec.Studies || 0);

                // Check Pioneer Statuses
                const remarkStr = String(rec.REMARKS || rec.Remarks || "").trim().toUpperCase();
                const isRP = remarkStr === "RP" || remarkStr.startsWith("RP ");
                const isAux = isTrueMarker(rec.AUX ?? rec.aux ?? rec.AuxPioneer ?? rec.Aux);

                // Check Active Reporting Status
                const hasMinistryFlag = isTrueMarker(rec.MINISTRY || rec.Ministry);
                const isReporting = hasMinistryFlag || hours > 0 || studies > 0 || isAux || isRP;

                // Ignore inactive or non-reporting records
                if (!isReporting) return;

                const joinedRecord = {
                    ...rec,
                    publisherName: publisher.fullName,
                    publisherProfile: publisher
                };

                // CLASSIFICATION (RP -> AUX -> Regular Publisher)
                if (isRP) {
                    if (!processedRpPubs.has(pubId)) {
                        processedRpPubs.add(pubId);
                        summary.rp.reports += 1;
                        summary.rp.hours += hours;
                        summary.rp.studies += studies;
                        summary.rp.details.push(joinedRecord);
                    }
                } else if (isAux) {
                    if (!processedAuxPubs.has(pubId)) {
                        processedAuxPubs.add(pubId);
                        summary.aux.reports += 1;
                        summary.aux.hours += hours;
                        summary.aux.studies += studies;
                        summary.aux.details.push(joinedRecord);
                    }
                } else {
                    if (!processedPubs.has(pubId)) {
                        processedPubs.add(pubId);
                        summary.pub.reports += 1;
                        summary.pub.hours += hours;
                        summary.pub.studies += studies;
                        summary.pub.details.push(joinedRecord);
                    }
                }
            });

            // Grand Totals
            summary.total.reports = summary.pub.reports + summary.aux.reports + summary.rp.reports;
            summary.total.hours   = summary.pub.hours   + summary.aux.hours   + summary.rp.hours;
            summary.total.studies = summary.pub.studies + summary.aux.studies + summary.rp.studies;
            window.currentMonthSummary = summary;

            // Update UI Fields (if setVal helper exists)
            if (typeof setVal === "function") {
                setVal('pub-reports', summary.pub.reports);
                setVal('pub-hours',   summary.pub.hours);
                setVal('pub-studies', summary.pub.studies);

                setVal('aux-reports', summary.aux.reports);
                setVal('aux-hours',   summary.aux.hours);
                setVal('aux-studies', summary.aux.studies);

                setVal('rp-reports',  summary.rp.reports);
                setVal('rp-hours',    summary.rp.hours);
                setVal('rp-studies',  summary.rp.studies);

                setVal('total-reports', summary.total.reports);
                setVal('total-hours',   summary.total.hours);
                setVal('total-studies', summary.total.studies);
            }

          };

        recordsReq.onsuccess = (e) => {
            recordsData = e.target.result || [];
            if (!pubsReq) processJoinAndSummary();
        };

        if (pubsReq) {
            pubsReq.onsuccess = (e) => {
                publishersDataLocal = e.target.result || [];
                processJoinAndSummary();
            };
        }

        transaction.onerror = (err) => {
            console.error("❌ Error running summary query:", err.target.error);
        };
    });
}

function RecordLog(targetDateEntered = 198) {
    const req = indexedDB.open("CongregationDB");

    req.onsuccess = (e) => {
        const db = e.target.result;
        const storeNames = Array.from(db.objectStoreNames);
        const targetStore = storeNames.find(name => 
            name.toUpperCase() === "RECORDS" || name.toUpperCase() === "S21RECORDS"
        ) || "RECORDS";

            return;
        }

            const records = getAllReq.result || [];
            const filtered = records.filter(r => 
                Number(r.Date_entered ?? r.NUMBER) === Number(targetDateEntered)

            mdTable += `| ${headers.map(() => "---").join(" | ")} |\n`;

            filtered.forEach((r, idx) => {
                const row = [
                    idx + 1,
                    r.IdPubs ?? r.IDPub ?? r.idpubs ?? "",
                    r.Date_entered ?? r.NUMBER ?? "",
                    r.AUX ?? r.aux ?? "",
                    r.MINISTRY ?? r.Ministry ?? "",

                ];

            console.log(mdTable);

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(mdTable)

function get6MonthActivePublisherIds(targetMonthIndex) {
    const target = Number(targetMonthIndex);
    const startMonthIndex = target - 5;
    
    const recData = Array.isArray(window.recordsData) ? window.recordsData : [];
    const pubData = (typeof publishersData !== 'undefined' && Array.isArray(publishersData)) ? publishersData : [];

    // 1. Build a Set of active Publisher IDs (Status is empty OR "active")
    const activePubIds = new Set(
        pubData
            .filter(p => {
                const statusVal = (p.Status || "").trim().toLowerCase();
                return !p.Status || statusVal === "" || statusVal === "active";
            })
            .map(p => String(p.IDPub ?? p.IdPubs ?? "").trim())
    );

    const isTrueMarker = (val) => {
        if (!val) return false;
        if (typeof val === "boolean") return val;
        if (typeof val === "number") return val !== 0;
        return ["?", "1", "Y", "YES", "TRUE", "-1"].includes(String(val).trim().toUpperCase());
    };

    const reportedIds = new Set();

    recData.forEach(r => {
        const monthNum = Number(r.Date_entered ?? r.NUMBER);
        if (monthNum >= startMonthIndex && monthNum <= target) {
            const rawPubId = r.IdPubs ?? r.IDPub ?? r.idpubs;
            if (rawPubId === undefined || rawPubId === null) return;

            const pubIdStr = String(rawPubId).trim();
            if (!pubIdStr) return;

            // Skip publishers who are inactive, moved out, or otherwise non-active
            if (activePubIds.size > 0 && !activePubIds.has(pubIdStr)) return;

            const hours = Number(r.HRS || r.Hours || 0);
            const studies = Number(r.BS || r.Studies || 0);
            const remarkStr = String(r.REMARKS || r.Remarks || "").trim().toUpperCase();
            const isRP = remarkStr === "RP" || remarkStr.startsWith("RP ");
            const isAux = isTrueMarker(r.AUX ?? r.aux ?? r.AuxPioneer ?? r.Aux);
            const hasMinistryFlag = isTrueMarker(r.MINISTRY || r.Ministry);

            if (hasMinistryFlag || hours > 0 || studies > 0 || isAux || isRP) {
                reportedIds.add(pubIdStr);
            }
        }
    });

    return reportedIds;
}

// ----------------------- irregulars
/**
 * Returns a Set of Publisher IDs who are IRREGULAR.
 * Adjusts the evaluation window for newly started, reactivated, or moved-in publishers 
 * by checking REMARKS for start markers.
 * 
 * @param {number} targetMonthIndex - The active month NUMBER (e.g., 194)
 * @returns {Set<string>} Set of irregular publisher IDs
 */
function getIrregularPublisherIds(targetMonthIndex) {
    const target = Number(targetMonthIndex);
    const startWindowIndex = target - 5; // Default 6-month window: [target - 5, target]

    const recData = Array.isArray(window.recordsData) ? window.recordsData : [];
    const pubData = (typeof publishersData !== 'undefined' && Array.isArray(publishersData)) ? publishersData : [];

    // 1. Get Active Publishers (Status is empty OR "active")
    const activePubSet = new Set(
        pubData
            .filter(p => {
                const statusVal = (p.Status || "").trim().toLowerCase();
                return !p.Status || statusVal === "" || statusVal === "active";
            })
            .map(p => String(p.IDPub ?? p.IdPubs ?? "").trim())
    );

    const isTrueMarker = (val) => {
        if (!val) return false;
        if (typeof val === "boolean") return val;
        if (typeof val === "number") return val !== 0;
        return ["?", "1", "Y", "YES", "TRUE", "-1"].includes(String(val).trim().toUpperCase());
    };

    // Keywords in REMARKS that mark a publisher's starting month
    const startKeywords = ["NEW UPD", "NEW", "RETURNED", "REACTIVATED", "MOVED IN"];

    const isStartRemark = (remarkStr) => {
        if (!remarkStr) return false;
        const upper = String(remarkStr).trim().toUpperCase();
        return startKeywords.some(kw => upper.includes(kw));
    };

    // Map: pubId -> Map<monthNum, { isReporting: boolean, isStart: boolean }>
    const pubHistory = new Map();
    activePubSet.forEach(pubId => {
        if (pubId) pubHistory.set(pubId, new Map());
    });

    // Populate history from recData within [startWindowIndex, target]
    recData.forEach(r => {
        const monthNum = Number(r.Date_entered ?? r.NUMBER);
        if (monthNum >= startWindowIndex && monthNum <= target) {
            const rawPubId = r.IdPubs ?? r.IDPub ?? r.idpubs;
            if (rawPubId === undefined || rawPubId === null) return;

            const pubIdStr = String(rawPubId).trim();
            if (!pubHistory.has(pubIdStr)) return;

            const hours = Number(r.HRS || r.Hours || 0);
            const studies = Number(r.BS || r.Studies || 0);
            const remarkStr = String(r.REMARKS || r.Remarks || "").trim();
            const isRP = remarkStr.toUpperCase() === "RP" || remarkStr.toUpperCase().startsWith("RP ");
            const isAux = isTrueMarker(r.AUX ?? r.aux ?? r.AuxPioneer ?? r.Aux);
            const hasMinistryFlag = isTrueMarker(r.MINISTRY || r.Ministry);

            const isReporting = hasMinistryFlag || hours > 0 || studies > 0 || isAux || isRP;
            const isStart = isStartRemark(remarkStr);

            pubHistory.get(pubIdStr).set(monthNum, { isReporting, isStart });
        }
    });

    const irregularPubIds = new Set();

    pubHistory.forEach((monthsMap, pubId) => {
        // Step 1: Find effective start month within the 6-month window
        let effectiveStartMonth = startWindowIndex;

        for (let m = startWindowIndex; m <= target; m++) {
            const mData = monthsMap.get(m);
            if (mData && mData.isStart) {
                effectiveStartMonth = m; // Reset start month to when they actually joined/reactivated
                break;
            }
        }

        // Step 2: Evaluate report consistency from effectiveStartMonth to target
        let reportedCount = 0;
        let missedCount = 0;

        for (let m = effectiveStartMonth; m <= target; m++) {
            const mData = monthsMap.get(m);
            if (mData && mData.isReporting) {
                reportedCount++;
            } else {
                missedCount++;
            }
        }

        // Irregular criteria:
        // - Missed at least 1 report during their active tenure window (missedCount > 0)
        // - Has reported at least once (reportedCount > 0)
        if (missedCount > 0 && reportedCount > 0) {
            irregularPubIds.add(pubId);
        }
    });

    return irregularPubIds;
}

    console.log("🔘 Print Preview clicked");

    const btn = document.getElementById('btnPrintPreview');

    try {
        btn.disabled = true;
        btn.textContent = "Loading...";

        // 1. Build the existing payload
        const payload = await buildPublisherPayloadForGAS();

        if (!payload) {
            console.error("❌ No payload generated.");
            return;
        }

        console.log("✅ Payload ready");
        console.log("👥 Publishers:", payload.publishers?.length || 0);

        // 2. Store the payload for the S-21 page
        sessionStorage.setItem(
            "s21_payload_data",
            JSON.stringify(payload)
        );

        console.log("💾 S-21 payload stored");

        // 3. Open the S-21 HTML
        const s21Window = window.open('/s21Card', '_blank');

        if (!s21Window) {
            alert("Popup blocked! Please allow popups for this site.");
            return;
        }

        console.log("✅ S-21 tab opened");

    } catch (err) {
        console.error("❌ Print Preview error:", err);
        alert("Error opening S-21:\n\n" + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = "PRINT PREVIEW";
    }
});

// ====================delete/add publisher
document.getElementById("btnDeletePublisher").addEventListener("click", deleteSelectedPublisher);

let isAddingPublisher = false;

document.getElementById("btnAddPublisher").addEventListener("click", startAddPublisher);

async function startAddPublisher() {
    try {
        const db = await openIndexedDB();

        const publishers = await new Promise((resolve, reject) => {
            const tx = db.transaction("PUBLISHERS", "readonly");
            const request = tx.objectStore("PUBLISHERS").getAll();
            request.onsuccess = () => resolve(request.result || []);
            request.onerror = () => reject(request.error);
        });

        db.close();

        // Find highest existing IDPub
        const maxID = publishers.reduce((max, p) => {
            const id = parseInt(p.IDPub, 10);
            return Number.isFinite(id) && id > max ? id : max;
        }, 0);

        const newIDPub = String(maxID + 1);

        // Enter ADD mode
        isAddingPublisher = true;

        // Clear current publisher selection
        currentSelectedPublisher = null;

        // Clear the publisher form
        clearPublisherForm();

        const nameEdit = document.getElementById("nameEditContainer");
        const nameDisplay = document.getElementById("pubNameDisplay");

        if (nameEdit) nameEdit.style.display = "flex";
        if (nameDisplay) nameDisplay.style.display = "none";

        // Store the generated ID temporarily
        window.newPublisherIDPub = newIDPub;

        // Change button
        const btn = document.getElementById("btnAddPublisher");
        btn.innerHTML = "💾 SAVE PUBLISHER";

        console.log("➕ Add Publisher mode");
        console.log("🆕 New IDPub:", newIDPub);

    } catch (err) {
        console.error("❌ Failed to start Add Publisher:", err);

        await showCustomAlert(
            "❌ ERROR\n\n" +
            "Unable to prepare a new publisher."
        );
    }
}


function clearPublisherForm() {
    // Name
    const lName = document.getElementById("editLName");
    const fName = document.getElementById("editFName");
    const mName = document.getElementById("editMName");
    if (lName) lName.value = "";
    if (fName) fName.value = "";
    if (mName) mName.value = "";

    // Name display
    const nameDisplay = document.getElementById("pubNameDisplay");
    if (nameDisplay) nameDisplay.value = "";

    // Dates
    const dob = document.getElementById("pubDob");
    const baptism = document.getElementById("pubBaptism");
    if (dob) dob.value = "";
    if (baptism) baptism.value = "";

    // Group
    const group = document.getElementById("pubGroup");
    if (group) group.value = "";

    // Gender
    const male = document.getElementById("isMale");
    const female = document.getElementById("isFemale");
    if (male) male.checked = false;
    if (female) female.checked = false;

    // Status
    const status = document.getElementById("pubStatus");
    if (status) status.value = "";

    // Privileges
    const elder = document.getElementById("isElder");
    const ms = document.getElementById("isMS");
    const rp = document.getElementById("isRP");
    const sp = document.getElementById("isSP");
    if (elder) elder.checked = false;
    if (ms) ms.checked = false;
    if (rp) rp.checked = false;
    if (sp) sp.checked = false;

    // Show the normal name display and hide the name editor
    const nameEdit = document.getElementById("nameEditContainer");
    if (nameEdit) nameEdit.style.display = "none";
    if (nameDisplay) nameDisplay.style.display = "";

    console.log("🧹 Publisher form cleared for new publisher.");

        // Clear S-21 table
    if (typeof s21Months !== "undefined") {
        s21Months.forEach((m, index) => {
            const minEl = document.getElementById(`${m.id}-ministry`);
            const bsEl = document.getElementById(`${m.id}-studies`);
            const auxEl = document.getElementById(`${m.id}-aux`);
            const hrsEl = document.getElementById(`${m.id}-hours`);
            const remTextEl = document.getElementById(`${m.id}-remark`);
            const remSelEl = document.getElementById(`${m.id}-select`);

            [minEl, bsEl, auxEl, hrsEl, remTextEl, remSelEl].forEach(el => {
                if (el) el.dataset.publisherId = "";
            });

            if (minEl) minEl.checked = false;
            if (bsEl) bsEl.value = "";
            if (auxEl) auxEl.checked = false;
            if (hrsEl) hrsEl.value = "";
            if (remTextEl) remTextEl.value = "";
            if (remSelEl) remSelEl.value = "";

            if (typeof attachS21AutoCheckListeners === "function") {
                attachS21AutoCheckListeners(index, m);
            }
        });

        if (typeof calculateTotalHours === "function") {
            calculateTotalHours();
        }
    }
    console.log("🧹 Publisher form and S-21 table cleared for new publisher.");
}


document.getElementById("btnAddPublisher").addEventListener("click", async () => {
    if (isAddingPublisher) {
        await saveNewPublisher();
    } else {
        await startAddPublisher();
    }
});

async function saveNewPublisher() {
    if (!isAddingPublisher) return;

    const publisherId = String(window.newPublisherIDPub || "").trim();
    const fName = document.getElementById("editFName")?.value.trim() || "";
    const mName = document.getElementById("editMName")?.value.trim() || "";
    const lName = document.getElementById("editLName")?.value.trim() || "";

    if (!publisherId) {
        await showCustomAlert("❌ ERROR\n\nNo new publisher ID was generated.");
        return;
    }

    if (!lName || !fName) {
        await showCustomAlert("⚠️ INCOMPLETE NAME\n\nPlease enter at least the Last Name and First Name.");
        return;
    }

    const newPublisher = {
        "1yrBaptized": "False",
        "Address": "",
        "AppointmentDate": "",
        "Baptism": document.getElementById("pubBaptism")?.value || "",
        "Birthdate": document.getElementById("pubDob")?.value || "",
        "Count_": "0",
        "DatePrinted": "",
        "Elder": document.getElementById("isElder")?.checked ? "1" : "0",
        "Elder1": "",
        "Elder2": "",
        "FNAME": fName,
        "Female": document.getElementById("isFemale")?.checked ? "1" : "0",
        "Fullname": `${lName}, ${fName}${mName ? " " + mName : ""}`,
        "GROUP": document.getElementById("pubGroup")?.value || "",
        "GROUP_": "",
        "ID": publisherId,
        "IDPub": publisherId,
        "LName": lName,
        "MName": mName,
        "MS": document.getElementById("isMS")?.checked ? "1" : "0",
        "Male": document.getElementById("isMale")?.checked ? "1" : "0",
        "MoveOut": "False",
        "Nname": fName,
        "Note1": "",
        "Print": "False",
        "RP": document.getElementById("isRP")?.checked ? "1" : "0",
        "ReportCount": "0",
        "RpDate": "",
        "RpDateStarted": "",
        "RpNumber": "",
        "Selected": "",
        "SF": document.getElementById("isSP")?.checked ? "1" : "0",
        "Started": "",
        "Status": document.getElementById("pubStatus")?.value || "",
        "TelCp": "",
        "TellHome": "",
        "Update": "False",
        "new": "True"
    };

    try {
        const db = await openIndexedDB();

        await new Promise((resolve, reject) => {
            const tx = db.transaction("PUBLISHERS", "readwrite");
            const store = tx.objectStore("PUBLISHERS");
            const request = store.add(newPublisher);

            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });

        db.close();

        console.log("✅ New publisher saved:", newPublisher);

        isAddingPublisher = false;
        window.newPublisherIDPub = null;

        const btn = document.getElementById("btnAddPublisher");
        if (btn) btn.innerHTML = "➕ ADD PUBLISHER";

        await showCustomAlert(
            "✅ PUBLISHER SAVED\n\n" +
            fName + (mName ? " " + mName : "") + " " + lName +
            "\n\nIDPub: " + publisherId
        );

        await loadPublishersFromIndexedDB();

        if (typeof loadPublishers === "function") {
            await loadPublishers();
        }

    } catch (err) {
        console.error("❌ Failed to save new publisher:", err);

        await showCustomAlert(
            "❌ SAVE FAILED\n\n" +
            (err?.message || "Unable to save the new publisher.")
        );
    }
}


document.addEventListener("DOMContentLoaded", () => {
    const multipleSelection = document.getElementById("chkMultipleSelection");
    const radioPublishers = document.getElementById("radioPublishers");
    const radioUnbaptized = document.getElementById("radioUnbaptized");
    const radioRegPioneers = document.getElementById("radioRegPioneers");

    if (!multipleSelection) return;

    multipleSelection.checked = false;
    if (radioPublishers) radioPublishers.checked = false;
    if (radioUnbaptized) radioUnbaptized.checked = false;
    if (radioRegPioneers) radioRegPioneers.checked = false;

    const returnToSingleSelection = () => {
        const activeItems = document.querySelectorAll("#publisherListbox .listbox-item.active");
        if (activeItems.length <= 1) return;

        let keepItem = null;

        if (currentSelectedPublisher) {
            const currentID = String(
                currentSelectedPublisher.IDPub ??
                currentSelectedPublisher.IdPubs ??
                ""
            ).trim();

            keepItem = [...activeItems].find(item =>
                String(item.dataset.id ?? "").trim() === currentID
            );
        }

        if (!keepItem) keepItem = activeItems[0];

        activeItems.forEach(item => {
            if (item !== keepItem) item.classList.remove("active");
        });
    };

    multipleSelection.addEventListener("change", () => {
        if (multipleSelection.checked) {
            // Multiple ON → renderListbox will use multi-select behavior.
            // Do NOT select a batch category automatically.
            console.log("☑️ Multiple Selection ON");
        } else {
            // Multiple OFF → return to one selected publisher.
            if (radioPublishers) radioPublishers.checked = false;
            if (radioUnbaptized) radioUnbaptized.checked = false;
            if (radioRegPioneers) radioRegPioneers.checked = false;

            returnToSingleSelection();
            console.log("⬜ Multiple Selection OFF");
        }

        if (typeof renderListbox === "function") {
            renderListbox();
        }
    });

    const handleBatchOptionChange = (selectedRadio) => {
        if (!selectedRadio.checked) return;

        // Any batch option requires Multiple Selection.
        multipleSelection.checked = true;

        // Only one batch option can be selected.
        [radioPublishers, radioUnbaptized, radioRegPioneers]
            .forEach(radio => {
                if (radio && radio !== selectedRadio) {
                    radio.checked = false;
                }
            });

        console.log("📦 Batch option selected:", selectedRadio.id);

        if (typeof renderListbox === "function") {
            renderListbox();
        }
    };

    radioPublishers?.addEventListener("change", () => {
        handleBatchOptionChange(radioPublishers);
    });

    radioUnbaptized?.addEventListener("change", () => {
        handleBatchOptionChange(radioUnbaptized);
    });

    radioRegPioneers?.addEventListener("change", () => {
        handleBatchOptionChange(radioRegPioneers);
    });
});
