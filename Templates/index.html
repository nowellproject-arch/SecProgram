async function switchTab(event,tabId){
    document.querySelectorAll('.tab-panel').forEach(panel=>{
        panel.classList.remove('active');
    });

    document.querySelectorAll('.top-nav button,.tab-btn').forEach(btn=>{
        btn.classList.remove('active');
    });

    const activePanel=document.getElementById(tabId);
    if(!activePanel)return;

    activePanel.classList.add('active');

    const selectedButton=event?.currentTarget||
        document.querySelector(`.top-nav button[onclick*="'${tabId}'"]`);

    selectedButton?.classList.add('active');

    const config=TAB_CONFIG[tabId];
    if(!config)return;

    if(activePanel.children.length===0){
        await loadSubForm(tabId,config.form,config.callback);
    }else{
        await config.callback?.();
    }

    if(tabId==="tab-3"){
        const iframe=activePanel.querySelector("iframe");
        if(iframe){
            const run=()=>iframe.contentWindow.loadUnbaptizedPublishers?.();
            if(iframe.contentDocument?.readyState==="complete")run();
            else iframe.addEventListener("load",run,{once:true});
        }
    }

    if(typeof renderListbox==='function'&&document.getElementById('publisherListbox')){
        renderListbox();
    }
}

// ============================================================
async function loadTablesFromIndexedDB() {
    const db = await openIndexedDB();

    const storeNames = [
        "CongInfo",
        "GROUPS",
        "PUBLISHERS",
        "MonthlyRecords",
        "RECORDS"
    ];

    const data = {};

    return new Promise((resolve, reject) => {
        const transaction =
            db.transaction(storeNames, "readonly");

        transaction.oncomplete = () => {
            db.close();
            console.log("✅ Loaded application data from IndexedDB.");
            resolve(data);
        };

        transaction.onerror = () => {
            db.close();
            reject(transaction.error);
        };

        for (const storeName of storeNames) {
            const request =
                transaction.objectStore(storeName).getAll();

            request.onsuccess = () => {
                data[storeName] = request.result;

                console.log(
                    `📖 ${storeName}:`,
                    request.result.length,
                    "records"
                );
            };
        }
    });
}


// ============================================================
// EXPORT ALL 5 INDEXEDDB STORES
// ============================================================
async function exportIndexedDBData() {

    const db = await openIndexedDB();

    const storeNames = [
        "CongInfo",
        "GROUPS",
        "PUBLISHERS",
        "MonthlyRecords",
        "RECORDS"
    ];

    const payload = {};

    return new Promise((resolve, reject) => {

        const transaction = db.transaction(
            storeNames,
            "readonly"
        );

        storeNames.forEach(storeName => {

            const store = transaction.objectStore(storeName);
            const request = store.getAll();

            request.onsuccess = () => {
                payload[storeName] = request.result || [];
            };

            request.onerror = () => {
                reject(request.error);
            };
        });

        transaction.oncomplete = () => {
            db.close();

            console.log(
                "✅ All 5 IndexedDB stores exported:",
                payload
            );

            resolve(payload);
        };

        transaction.onerror = () => {
            db.close();
            reject(transaction.error);
        };
    });
}



// Helper: Open IDB Database
function openIndexedDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open("CongregationDB");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

// Helper: Extract modified records newer than lastSync
function getModifiedRecords(db, storeName, lastSync) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const req = store.getAll();

        req.onsuccess = () => {
            const records = req.result || [];
            // Filter records updated since last sync (or include all if lastSync === 0)
            const modified = records.filter(r => !r.updated_at || r.updated_at > lastSync);
            resolve(modified);
        };
        req.onerror = () => reject(req.error);
    });
}

// Helper: Apply server updates to local object stores
function mergeServerUpdates(db, updates) {
    return new Promise((resolve, reject) => {
        const stores = Object.keys(updates).filter(k => updates[k] && updates[k].length > 0);
        if (stores.length === 0) return resolve();

        const tx = db.transaction(stores, "readwrite");
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);

        stores.forEach(storeName => {
            const store = tx.objectStore(storeName);
            updates[storeName].forEach(item => {
                // Remap field names where SQLite schema differs slightly from IDB store names
                if (storeName === 'GROUPS' && item.Group_) {
                    item.Group = item.Group_;
                    delete item.Group_;
                }
                if (storeName === 'PUBLISHERS' && item.GROUP_) {
                    item.GROUP = item.GROUP_;
                    delete item.GROUP_;
                }

                if (item.is_deleted === 1) {
                    const key = item.id || item.IDPub || item.NUM || item.ID;
                    if (key) store.delete(key);
                } else {
                    store.put(item);
                }
            });
        });
    });
}

// 1. Backup Action (Backup to Cloud)
async function handleBackupAction() {
    console.time("⏱️ Backup Duration");
    console.log("🚀 Initializing full cloud backup...");

    const passcode = localStorage.getItem('user_passcode');
    if (!passcode) {
        console.warn("⚠️ Backup aborted: Missing passcode in localStorage.");
        alert("Passcode missing. Please log in again.");
        return;
    }

    const cloudBtn = document.getElementById('btn-cloud-sync');
    const syncStatus = document.getElementById('sync-status');


 

    if (syncStatus) {
        syncStatus.style.display = "inline";
        syncStatus.textContent = "● Backing up...";
        syncStatus.style.color = "#ffc107";
    }
    if (cloudBtn) cloudBtn.disabled = true;
 

    try {
        // 1. Extract full snapshot from IndexedDB
        console.log("📦 Reading all stores from IndexedDB...");
        const fullPayload = await exportIndexedDBData();

        const totalRecords = Object.values(fullPayload).reduce((acc, arr) => acc + (arr ? arr.length : 0), 0);
        console.log(`📤 Extracted ${totalRecords} total record(s) across all stores for backup.`);

        // 2. Point to the correct API endpoint URL
        // 💡 UPDATE THIS PATH if your backend API is on a different route or port (e.g., 'http://127.0.0.1:8000/backup')
        const BACKUP_URL = '/api/backup';
        console.log(`📡 Sending POST request to ${BACKUP_URL}...`);

        const response = await fetch(BACKUP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                passcode: passcode,
                payload: fullPayload
            })
        });

        // 3. Safe response handler (prevents SyntaxError on 404 HTML responses)
        if (!response.ok) {
            let errorMessage = `Server status ${response.status} (${response.statusText})`;
            try {
                const errorJson = await response.json();
                errorMessage = errorJson.detail || errorJson.error || errorMessage;
            } catch (_) {
                // Server returned non-JSON response (e.g., standard 404 HTML page)
            }
            throw new Error(errorMessage);
        }

        const result = await response.json();
        console.log("📥 Backup Response Received:", result);

        // 4. Update sync status UI and local timestamp
        const backupTime = result.updated_at || Date.now();
        localStorage.setItem('last_sync_timestamp', backupTime);

        if (syncStatus) {
            syncStatus.style.display = "inline";
            syncStatus.textContent = "● Saved";
            syncStatus.style.color = "#28a745";
            
        }
          localStorage.setItem("sync_unsaved", "false");
      
       

    } catch (err) {
        console.error("❌ Backup failed with error:", err);
        if (syncStatus) {
            syncStatus.textContent = "● Backup Error";
            syncStatus.style.color = "#dc3545";
        }
       
    } finally {
        if (cloudBtn) cloudBtn.disabled = false;
        console.timeEnd("⏱️ Backup Duration");
    }
}

// 2. Open Restore Modal & Display Available Backup Slots
async function openRestoreModal() {
  document.getElementById('cloud-dropdown').style.display = 'none';
  const modal = document.getElementById('restore-modal');
  const container = document.getElementById('backup-list-container');

  // Check all possible storage keys or fallback to active session variable
  const passcode = (
    localStorage.getItem('user_passcode') || 
    localStorage.getItem('passcode') || 
    window.currentPasscode || 
    ''
  ).trim();

  // Console log to verify what string is actually being sent
  console.log("Fetching backups for passcode:", passcode);

      if (!passcode) {
        await showCustomAlert(
            "⚠️ PASSCODE MISSING\n\n" +
            "Your login session could not be verified.\n\n" +
            "Please log in again and try again."
        );
        return;
      }

  container.innerHTML = '<div style="text-align:center; padding: 10px; color: #666; font-size: 13px;">Loading backups...</div>';
  modal.style.display = 'flex';

  try {
    const res = await fetch(`/api/backup-slots?passcode=${encodeURIComponent(passcode)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const backups = await res.json();

    if (!backups || backups.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding: 10px; color: #777; font-size: 13px;">No backups found for passcode: ${passcode}</div>`;
      return;
    }

    container.innerHTML = '';
    backups.forEach((backup, index) => {
      const btn = document.createElement('button');
      btn.style.cssText = 'width: 100%; padding: 10px; text-align: left; background: #f8f9fa; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;';
      btn.onmouseover = () => btn.style.backgroundColor = '#e9ecef';
      btn.onmouseout = () => btn.style.backgroundColor = '#f8f9fa';

      const tag = index === 0 ? '<span style="background: #28a745; color: white; padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-left: 6px;">LATEST</span>' : '';

      btn.innerHTML = `<div>📅 ${backup.updated_at} ${tag}</div> <strong style="color: #6f42c1;">Restore</strong>`;
      btn.onclick = () => confirmRestore(backup.id);
      container.appendChild(btn);
    });

  } catch (err) {
    container.innerHTML = `<div style="text-align:center; color: red; font-size: 13px;">Error loading backups: ${err.message}</div>`;
  }
}

function closeRestoreModal() {
  document.getElementById('restore-modal').style.display = 'none';
}

  function confirmRestore(backupId) {
      executeRestore(backupId);
  }


// 3. Execute Restore from Chosen Slot
async function executeRestore(slotNumber) {
    const passcode = localStorage.getItem('user_passcode');

    const confirmed = await showCustomConfirm(
        `⚠️ RESTORE BACKUP\n\n` +
        `Restore data from Backup Slot ${slotNumber}?\n\n` +
        `Any unsaved changes on this device will be replaced.\n\n` +
        `Do you want to continue?`
    );

    if (!confirmed) return;

    try {
        const res = await fetch(`/api/restore-slot?passcode=${encodeURIComponent(passcode)}&slot=${slotNumber}`);
        const result = await res.json();

        if (!res.ok) throw new Error(result.detail || 'Restore failed.');

        await saveToIndexedDB(result.data);

        await showCustomAlert(
            "✅ RESTORE COMPLETED\n\n" +
            "Your backup has been restored successfully."
        );

        closeRestoreModal();
        window.location.reload();
    } catch (err) {
        await showCustomAlert(
            "❌ RESTORE ERROR\n\n" +
            err.message
        );
    }
}

function toggleCloudMenu(event) {

    const isOpen = dropdown.style.display === "block";

    closeCloudSubmenus();

    dropdown.style.display = isOpen ? "none" : "block";
}

function toggleBackupSubmenu(event) {
    event.stopPropagation();

    const backup =
        document.getElementById("backup-submenu");

    const restore =
        document.getElementById("restore-submenu");

    const backupArrow =
        document.getElementById("backup-arrow");

    const restoreArrow =
        document.getElementById("restore-arrow");

    if (!backup) return;

    const isOpen =
        backup.style.display === "block";

    // Close Restore
    if (restore) {
        restore.style.display = "none";
    }

    if (restoreArrow) {
        restoreArrow.textContent = "▸";
    }

    // Toggle Backup
    backup.style.display =
        isOpen ? "none" : "block";

    if (backupArrow) {
        backupArrow.textContent =
            isOpen ? "▸" : "▾";
    }
}

document.addEventListener("click", function (event) {
  const dropdown = document.getElementById("cloud-dropdown");
  const cloudBtn = document.getElementById("btn-cloud-sync");

  if (!dropdown || !cloudBtn) return;

  // Clicked outside both Cloud button and dropdown
  if (!dropdown.contains(event.target) &&
      !cloudBtn.contains(event.target)) {

    dropdown.style.display = "none";

    // Close Backup submenu
    const backup = document.getElementById("backup-submenu");
    if (backup) backup.style.display = "none";

    // Close Restore submenu
    const restore = document.getElementById("restore-submenu");
    if (restore) restore.style.display = "none";
  }
});



async function logout() {
    const confirmed = await showCustomConfirm(
        "⚠️ WARNING\n\n" +
        "Logging out will remove the data currently saved on this device.\n\n" +
        "Please make sure your latest backup is complete before continuing.\n\n" +
        "Do you want to continue?"
    );
    if (!confirmed) {
        console.log("Logout cancelled by user.");
        return;
    }

    localStorage.clear();
    sessionStorage.clear();

    const deleteReq =
        indexedDB.deleteDatabase("CongregationDB");

    deleteReq.onsuccess = () => {
        console.log("✅ IndexedDB deleted.");
        window.location.href = "/login.html";
    };

    deleteReq.onerror = (err) => {
        console.error("❌ IndexedDB delete error:", err);
        window.location.href = "/login.html";
    };

    deleteReq.onblocked = () => {
        console.warn("⚠️ IndexedDB deletion blocked.");
        window.location.href = "/login.html";
    };
}

async function loadSubForm(tabId,filename,callback){
    try{
        const cacheBuster=`?_=${Date.now()}`;
        const response=await fetch(`/Templates/${filename}${cacheBuster}`,{
            cache:"no-store"
        });

        if(!response.ok){
            throw new Error(`HTTP ${response.status}: Failed to load ${filename}`);
        }

        const html=await response.text();
        const panel=document.getElementById(tabId);
        if(!panel)return;

        panel.innerHTML=html;

        const scripts=[...panel.querySelectorAll("script")];

        for(const oldScript of scripts){
            const newScript=document.createElement("script");

            for(const attr of oldScript.attributes){
                newScript.setAttribute(attr.name,attr.value);
            }

            newScript.setAttribute("data-template-src",filename);
            newScript.textContent=oldScript.textContent;

            oldScript.replaceWith(newScript);
        }

        if(typeof callback==="function"){
            await callback();
        }
    }catch(error){
        console.error(`Error loading subform [${filename}]:`,error);
    }
}
