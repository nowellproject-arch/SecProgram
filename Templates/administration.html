<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - Congregation Management</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #b4b6ba;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 0.85rem;
    }
    .card {
      border: none;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .card-header {
      background-color: #fff;
      border-bottom: 1px solid #edf2f7;
      border-top-left-radius: 8px !important;
      border-top-right-radius: 8px !important;
      padding: 8px 12px;
      font-weight: 600;
    }
    .card-body {
      padding: 12px;
    }
    .form-label {
      font-weight: 600;
      font-size: 0.75rem;
      color: #063d9d;
      font-weight: bold; 
      margin-bottom: 2px;
    }
    
    .form-control, .form-control-sm {
      padding: 3px 8px;
      font-size: 0.82rem;
      border-radius: 5px;
    }
    .btn-custom {
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #718096;
      margin-top: 6px;
      margin-bottom: 6px;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 2px;
      font-weight: bold;
    }
    .table td, .table th {
      padding: 6px 10px;
      font-size: 0.82rem;
    }
  </style>
</head>
<body class="p-2 p-md-3">

<div class="container-fluid">
  <!-- Header -->
  <div class="d-flex align-items-center justify-content-between mb-2">
    <div>
      <h5 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-sliders text-primary me-2"></i>Administration</h5>
    </div>
  </div>

  <div class="row g-3">
    
    <!-- LEFT SIDE: Congregation & Service Committee Form -->
    <div class="col-lg-5 col-xl-4">
      <div class="card">
        <div class="card-header d-flex align-items-center">
        

          <svg class="text-primary me-2" style="height: 1em; width: auto; vertical-align: -0.125em;" viewBox="0 0 50 45" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M 5 10 H 45 V 40 H 5 Z M 8 13 V 37 H 42 V 13 Z" fill-rule="evenodd"/>
          <rect x="15" y="25" width="8" height="12" fill="currentColor"/>
          <rect x="27" y="16" width="12" height="16" fill="currentColor"/>
          <text x="33" y="28" font-family="sans-serif" font-weight="bold" font-size="8" fill="#ffffff" text-anchor="middle">JW</text>
          <line x1="1" y1="40" x2="49" y2="40" stroke="currentColor" stroke-width="2"/>
        </svg> Congregation Details
        </div>
        <div class="card-body">
          <form id="congInfoForm">
            
            <!-- General Info -->
            <div class="section-title"><i class="fa-solid fa-circle-info me-1"></i> General Details</div>
            
            <div class="row g-2 mb-2">
              <div class="col-8">
                <label for="Congregation" class="form-label">Congregation</label>
                <input type="text" class="form-control" id="Congregation" required>
              </div>
              <div class="col-4">
                <label for="CongNumber" class="form-label">Cong #</label>
                <input type="text" class="form-control" id="CongNumber" required>
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-6">
                <label for="Address" class="form-label">City/Town</label>
                <input type="text" class="form-control" id="Address">
              </div>
              <div class="col-6">
                <label for="Province" class="form-label">Province</label>
                <input type="text" class="form-control" id="Province">
              </div>
            </div>

            <!-- Service Committee Section -->
            <div class="section-title"><i class="fa-solid fa-user-shield me-1"></i> Service Committee</div>

            <div class="mb-1">
              <label for="CBOE" class="form-label">Coordinator (COBE)</label>
              <input type="text" class="form-control" id="CBOE">
            </div>

            <div class="mb-1">
              <label for="SEC" class="form-label">Secretary (SEC)</label>
              <input type="text" class="form-control" id="SEC">
            </div>

            <div class="mb-2">
              <label for="SO" class="form-label">Service Overseer (SO)</label>
              <input type="text" class="form-control" id="SO">
            </div>

            <!-- Access & Account (Read-Only) -->
            <div class="section-title"><i class="fa-solid fa-lock me-1"></i> System Access Info</div>
            
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label for="user" class="form-label">User</label>
                <input type="text" class="form-control bg-light" id="user" readonly>
              </div>
              <div class="col-6">
                <label for="passcode" class="form-label">Passcode (Key)</label>
                <input type="text" class="form-control bg-light" id="passcode" readonly>
              </div>
            </div>

          </form>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE: Field Service Groups Table -->
    <div class="col-lg-7 col-xl-8">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="fa-solid fa-users-rectangle text-primary me-2"></i> Field Service Groups</span>
          <button class="btn btn-sm btn-success btn-custom" onclick="openAddGroupModal()">
            <i class="fa-solid fa-plus me-1"></i> Add Group
          </button>
        </div>
        <div class="card-body p-0 table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col" class="ps-3">Group #</th>
                <th scope="col">Overseer</th>
                <th scope="col">Assistant</th>
                <th scope="col">Meeting Place</th>
                <th scope="col" class="text-end pe-3">Action</th>
              </tr>
            </thead>
            <tbody id="groupsTableBody">
              <!-- Dynamic Rows Inserted Here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Modal for Add/Edit Group -->
<div class="modal fade" id="groupModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-sm">
    <div class="modal-content" style="border-radius: 8px;">
      <div class="modal-header py-2">
        <h6 class="modal-title fw-bold" id="groupModalLabel">Group Details</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body py-2">
        <form id="groupForm">
          <input type="hidden" id="groupId">
          <div class="mb-2">
            <label for="groupNumber" class="form-label">Group Number (Key)</label>
            <input type="text" class="form-control" id="groupNumber" required>
          </div>
          <div class="mb-2">
            <label for="groupOverseer" class="form-label">Overseer</label>
            <input type="text" class="form-control" id="groupOverseer">
          </div>
          <div class="mb-2">
            <label for="groupAssistant" class="form-label">Assistant</label>
            <input type="text" class="form-control" id="groupAssistant">
          </div>
          <div class="mb-2">
            <label for="groupMeetingPlace" class="form-label">Meeting Place</label>
            <input type="text" class="form-control" id="groupMeetingPlace">
          </div>
          <div class="text-end mt-3">
            <button type="button" class="btn btn-sm btn-secondary me-1" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-sm btn-primary">Save Group</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/indexeddb.js"></script>

<script>
  let db;
  let rawGroupsList = [];

  // Initialize Default LocalStorage values if not existing
  function initLocalStorage() {
    if (!localStorage.getItem('username')) {
      localStorage.setItem('username', 'NoelDI');
    }
    if (!localStorage.getItem('user_passcode')) {
      localStorage.setItem('user_passcode', 'C001');
    }
  }

  function loadCongInfo(){
    return new Promise((resolve,reject)=>{
      const tx = db.transaction("CongInfo","readonly");
      const req = tx.objectStore("CongInfo").getAll();
      req.onsuccess = e => {
        const list = e.target.result || [];
        
        // Fetch local storage values
        const localUser = localStorage.getItem('username') || "NoelDI";
        const localPasscode = localStorage.getItem('user_passcode') || "C001";

        if(list.length){
          const data = list[0];
          document.getElementById("Congregation").value = data.Congregation || "";
          document.getElementById("CongNumber").value = data.CongNumber || "";
          document.getElementById("Address").value = data.Address || "";
          document.getElementById("Province").value = data.Province || "";
          document.getElementById("CBOE").value = data.CBOE || "";
          document.getElementById("SEC").value = data.SEC || "";
          document.getElementById("SO").value = data.SO || "";
          
          // Prefer object data or fallback to LocalStorage
          document.getElementById("user").value = data.user && data.user.trim() ? data.user : localUser;
          document.getElementById("passcode").value = data.passcode && data.passcode.trim() ? data.passcode : localPasscode;
        } else {
          // If no IndexedDB record, set local values directly
          document.getElementById("user").value = localUser;
          document.getElementById("passcode").value = localPasscode;
        }
        resolve();
      };
      req.onerror = () => reject(req.error);
    });
  }

function setupCongInfoAutoSave() {

    const fields = [
        "Congregation",
        "CongNumber",
        "Address",
        "Province",
        "CBOE",
        "SEC",
        "SO"
    ];

    fields.forEach(id => {

        const el = document.getElementById(id);

        if(!el) return;

        el.addEventListener("change", () => {
            saveCongInfo();
        });

    });

    console.log("✅ Congregation Info auto-save enabled");
}


 async function saveCongInfo() {

    try {
        const txRead = db.transaction('CongInfo', 'readonly');
        const storeRead = txRead.objectStore('CongInfo');
        const getReq = storeRead.getAll();

        getReq.onsuccess = () => {

            const existingData =
                getReq.result.length > 0
                    ? getReq.result[0]
                    : {};

            // Keep user and passcode exactly as already stored
            const infoData = {
                ...existingData,

                Address: document.getElementById('Address').value,
                CBOE: document.getElementById('CBOE').value,
                CongNumber: document.getElementById('CongNumber').value,
                Congregation: document.getElementById('Congregation').value,
                Province: document.getElementById('Province').value,
                SEC: document.getElementById('SEC').value,
                SO: document.getElementById('SO').value
            };

            const txWrite = db.transaction('CongInfo', 'readwrite');
            const storeWrite = txWrite.objectStore('CongInfo');

            storeWrite.put(infoData);

            txWrite.oncomplete = () => {
                console.log("💾 Congregation Info auto-saved");
                
                if(typeof window.setSyncUnsaved === "function"){
                    window.setSyncUnsaved();
                }
            };

            txWrite.onerror = () => {
                console.error(
                    "❌ Failed to save Congregation Info:",
                    txWrite.error
                );
            };
        };

        getReq.onerror = () => {
            console.error(
                "❌ Failed to read Congregation Info:",
                getReq.error
            );
        };

    } catch(err) {
        console.error("❌ Congregation Info save error:", err);
    }
}


  function loadGroups(){
    return new Promise((resolve,reject)=>{
      const tx = db.transaction("GROUPS","readonly");
      const req = tx.objectStore("GROUPS").getAll();
      req.onsuccess = e => {
        rawGroupsList = e.target.result || [];
        const tbody = document.getElementById("groupsTableBody");
        tbody.innerHTML = "";
        
        if(!rawGroupsList.length){
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-2">No group records.</td></tr>';
          resolve();
          return;
        }

        rawGroupsList.sort((a,b) => Number(a.Group) - Number(b.Group));
        rawGroupsList.forEach((g, index) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="ps-3 fw-bold">Group ${g.Group || ""}</td>
            <td>${g.Overseer || "-"}</td>
            <td>${g.Assistant || "-"}</td>
            <td>${g.MeetingPlace || "-"}</td>
            <td class="text-end pe-3">
              <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" onclick="editGroup(${index})">
                <i class="fa-solid fa-pen-to-square"></i> Edit
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
        resolve();
      };
      req.onerror = () => reject(req.error);
    });
  }

  function saveGroupToDB(groupObj) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('GROUPS', 'readwrite');
      const store = tx.objectStore('GROUPS');
      const req = store.put(groupObj);
      req.onsuccess = () => resolve();
      req.onerror = (evt) => reject(evt.target.error);
    });
  }

  async function handleGroupSubmit(e) {
    e.preventDefault();
    const groupNum = document.getElementById('groupNumber').value.trim();
    const existingId = document.getElementById('groupId').value;

    const existingObj = rawGroupsList.find(g => String(g.Group) === String(groupNum) || String(g.id) === String(existingId)) || {};

    const groupData = {
      ...existingObj,
      Group: groupNum,
      Overseer: document.getElementById('groupOverseer').value,
      Assistant: document.getElementById('groupAssistant').value,
      MeetingPlace: document.getElementById('groupMeetingPlace').value,
      Remarks: existingObj.Remarks || ''
    };

    if (existingId) {
      groupData.id = existingId;
    } else if (!groupData.id) {
      groupData.id = groupNum;
    }

    try {
      await saveGroupToDB(groupData);
      
      const modalEl = document.getElementById('groupModal');
      const modalInstance = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
      modalInstance.hide();

      await loadGroups();
    } catch(err) {
      console.error("Save group error:", err);
      alert("Failed to save group details.");
    }
  }

  function openAddGroupModal() {
    clearGroupForm();
    document.getElementById('groupModalLabel').innerText = "Add New Group";
    const modalEl = document.getElementById('groupModal');
    const modalInstance = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
    modalInstance.show();
  }

  function editGroup(index) {
    const group = rawGroupsList[index];
    if (!group) return;

    document.getElementById('groupModalLabel').innerText = "Edit Group " + group.Group;
    document.getElementById('groupId').value = group.id || group.Group;
    document.getElementById('groupNumber').value = group.Group || '';
    document.getElementById('groupOverseer').value = group.Overseer || '';
    document.getElementById('groupAssistant').value = group.Assistant || '';
    document.getElementById('groupMeetingPlace').value = group.MeetingPlace || '';

    const modalEl = document.getElementById('groupModal');
    const modalInstance = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
    modalInstance.show();
  }

  function clearGroupForm() {
    document.getElementById('groupForm').reset();
    document.getElementById('groupId').value = '';
  }

  // --- Initializer ---
  window.loadAdministration = async function() {
    try {
      initLocalStorage();
      db = await openIndexedDB();
      await loadCongInfo();
      setupCongInfoAutoSave();
      await loadGroups();

      document.getElementById('groupForm').addEventListener('submit', handleGroupSubmit);

      console.log("✅ Administration loaded from IndexedDB");
    } catch(err) {
      console.error("❌ Administration database error:", err);
    }
  };

  window.addEventListener('DOMContentLoaded', () => {
    if (typeof openIndexedDB === 'function') {
      window.loadAdministration();
    }
  });
</script>

</body>
</html>
